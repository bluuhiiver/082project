<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>LinguaMaster — 7개 언어 마스터 코치</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#4F46E5"/>
  <meta name="description" content="프랑스어, 영어, 스페인어, 중국어, 한국어, 일본어, 이탈리아어를 배우는 개인 맞춤형 언어 학습 앱"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div id="app">

    <!-- ═══ ONBOARDING ═══ -->
    <section class="view" id="view-onboard">
      <div class="ob-progress" id="ob-progress"></div>
      <div class="ob-content" id="ob-content"></div>
    </section>

    <!-- ═══ HOME ═══ -->
    <section class="view" id="view-home">
      <div class="scroll-area" id="home-content"></div>
      <nav class="bottom-nav" id="bottom-nav"></nav>
    </section>

    <!-- ═══ VOCAB ═══ -->
    <section class="view" id="view-vocab">
      <div class="scroll-area" id="vocab-content"></div>
      <nav class="bottom-nav" id="bottom-nav-2"></nav>
    </section>

    <!-- ═══ GRAMMAR ═══ -->
    <section class="view" id="view-grammar">
      <div class="scroll-area" id="grammar-content"></div>
      <nav class="bottom-nav" id="bottom-nav-3"></nav>
    </section>

    <!-- ═══ PRACTICE (speaking + listening) ═══ -->
    <section class="view" id="view-practice">
      <div class="scroll-area" id="practice-content"></div>
      <nav class="bottom-nav" id="bottom-nav-4"></nav>
    </section>

    <!-- ═══ PROGRESS (stats + immersion + weekly test) ═══ -->
    <section class="view" id="view-progress">
      <div class="scroll-area" id="progress-content"></div>
      <nav class="bottom-nav" id="bottom-nav-5"></nav>
    </section>

    <!-- toast -->
    <div id="toast" class="toast"></div>

    <!-- language switch / add-language sheet -->
    <div id="sheet-backdrop" class="sheet-backdrop" onclick="App.closeSheet(event)">
      <div class="sheet" id="sheet-content" onclick="event.stopPropagation()"></div>
    </div>
  </div>

  <script src="data/lang-fr.js"></script>
  <script src="data/lang-en.js"></script>
  <script src="data/lang-es.js"></script>
  <script src="data/lang-zh.js"></script>
  <script src="data/lang-ko.js"></script>
  <script src="data/lang-ja.js"></script>
  <script src="data/lang-it.js"></script>
  <script src="app.js"></script>
</body>
</html>
