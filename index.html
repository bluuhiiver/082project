<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>캐치업 — 오늘의 Z세대 트렌드</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#7C3AED"/>
<meta name="description" content="Z세대 트렌드를 하루 한 번, 한 곳에서 캐치업하는 로컬 트렌드 앱."/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#FAFAF8; --white:#fff; --black:#18181B;
  --primary:#7C3AED; --primary-dark:#6D28D9; --primary-light:#F3EEFF;
  --accent:#F59E0B; --accent-bg:#FEF3C7;
  --info:#0EA5E9; --info-bg:#E0F2FE;
  --gray:#71717A; --gray-light:#F4F4F5; --border:#E4E4E7;
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--black);min-height:100dvh;-webkit-font-smoothing:antialiased;}
button,input{font-family:var(--font);}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;}
.view{display:none;flex-direction:column;flex:1;padding-bottom:70px;}
.view.active{display:flex;animation:fadeUp .18s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── HEADER / NAV ── */
.top-hd{padding:18px 18px 0;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:1.35rem;font-weight:800;letter-spacing:-.03em;}
.logo span{color:var(--primary);}
.nav-bar{background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;}
.back-btn,.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--gray-light);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
.icon-btn.on{background:var(--primary-light);color:var(--primary);}
.nav-title{font-size:1rem;font-weight:700;flex:1;}
.nav-spacer{flex:1;}

/* ── TICKER (마이크로 트렌드 전광판) ── */
.ticker-wrap{margin:16px 18px 4px;background:var(--black);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px;overflow:hidden;}
.ticker-label{font-size:.68rem;font-weight:700;color:var(--accent);letter-spacing:.04em;flex-shrink:0;white-space:nowrap;}
.ticker-track{flex:1;overflow:hidden;position:relative;height:18px;}
.ticker-item{position:absolute;inset:0;color:#fff;font-size:.78rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .4s ease;}
.ticker-item.show{opacity:1;}
.ticker-time{color:#A1A1AA;margin-left:6px;}

/* ── SEARCH ── */
.search-area{padding:14px 18px 0;display:flex;gap:8px;}
.search-wrap{flex:1;position:relative;}
.search-inp{width:100%;padding:12px 14px 12px 40px;border-radius:12px;border:2px solid var(--border);font-size:.86rem;background:var(--white);color:var(--black);outline:none;transition:border-color .2s;}
.search-inp:focus{border-color:var(--primary);}
.search-icon-l{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--gray);pointer-events:none;font-size:.95rem;}

/* ── CATEGORY CHIPS ── */
.cat-scroll{display:flex;gap:8px;padding:16px 18px 4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-chip{flex-shrink:0;padding:8px 15px;border-radius:100px;border:2px solid var(--border);background:var(--white);font-size:.8rem;font-weight:600;color:var(--gray);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.cat-chip.sel{border-color:var(--primary);background:var(--primary);color:#fff;}

/* ── ARTICLE LIST ── */
.list-wrap{padding:14px 18px 8px;display:flex;flex-direction:column;gap:12px;}
.art-card{display:flex;gap:12px;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:13px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s;}
.art-card:active{transform:scale(.98);}
.art-thumb{width:62px;height:62px;border-radius:12px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex-shrink:0;}
.art-body{flex:1;min-width:0;}
.art-badges{display:flex;gap:5px;margin-bottom:5px;}
.badge{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em;}
.badge-hot{background:#FEE2E2;color:#DC2626;}
.badge-rising{background:var(--info-bg);color:var(--info);}
.badge-cat{background:var(--gray-light);color:var(--gray);}
.art-title{font-size:.9rem;font-weight:700;line-height:1.35;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.art-summary{font-size:.76rem;color:var(--gray);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;margin-bottom:5px;}
.art-meta{font-size:.7rem;color:#A1A1AA;}
.empty-state{padding:40px 20px;text-align:center;color:var(--gray);font-size:.85rem;}

/* ── ARTICLE DETAIL ── */
.art-detail{padding:6px 20px 24px;}
.detail-cat{display:inline-block;font-size:.72rem;font-weight:700;color:var(--primary);background:var(--primary-light);padding:4px 10px;border-radius:8px;margin-bottom:12px;}
.detail-title{font-size:1.35rem;font-weight:800;line-height:1.35;margin-bottom:8px;}
.detail-meta{font-size:.76rem;color:var(--gray);margin-bottom:18px;}
.detail-thumb{width:100%;height:160px;border-radius:16px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:3.4rem;margin-bottom:18px;}
.detail-body p{font-size:.9rem;line-height:1.75;color:#27272A;margin-bottom:14px;}
.tag-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;margin-bottom:22px;}
.tag-chip{font-size:.74rem;color:var(--primary);background:var(--primary-light);padding:5px 11px;border-radius:100px;font-weight:600;}
.detail-actions{display:flex;gap:10px;margin-bottom:26px;}
.act-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:12px;border:2px solid var(--border);background:var(--white);font-size:.82rem;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.act-btn.on{border-color:var(--primary);background:var(--primary-light);color:var(--primary);}
.section-label{font-size:.78rem;font-weight:700;color:var(--gray);margin:0 20px 10px;letter-spacing:.02em;}

/* ── DICTIONARY ── */
.dict-list{padding:6px 18px 8px;display:flex;flex-direction:column;gap:10px;}
.dict-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.dict-term-row{display:flex;align-items:center;justify-content:between;gap:8px;}
.dict-term{font-size:1rem;font-weight:800;color:var(--primary);}
.dict-tag{font-size:.65rem;font-weight:700;color:var(--gray);background:var(--gray-light);padding:2px 8px;border-radius:6px;margin-left:8px;}
.dict-meaning{font-size:.8rem;color:#3F3F46;margin-top:5px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.dict-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:none;}
.dict-card.open .dict-detail{display:block;}
.dict-detail-row{font-size:.78rem;margin-bottom:8px;line-height:1.55;}
.dict-detail-label{font-weight:700;color:var(--gray);margin-right:4px;}
.dict-save-btn{margin-top:6px;font-size:.75rem;font-weight:700;color:var(--primary);background:var(--primary-light);border:none;padding:7px 12px;border-radius:9px;cursor:pointer;}
.dict-save-btn.on{background:var(--primary);color:#fff;}

/* ── CALENDAR ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 4px;}
.cal-nav-btn{width:34px;height:34px;border-radius:9px;background:var(--gray-light);border:none;font-size:1rem;cursor:pointer;}
.cal-month-label{font-size:1.02rem;font-weight:800;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px 18px;}
.cal-dow{font-size:.68rem;color:var(--gray);text-align:center;font-weight:700;padding-bottom:4px;}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:.78rem;font-weight:600;cursor:default;position:relative;}
.cal-cell.has-day{cursor:pointer;}
.cal-cell.today{background:var(--primary);color:#fff;}
.cal-cell.sel:not(.today){background:var(--primary-light);color:var(--primary);}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;bottom:6px;}
.cal-cell.today .cal-dot{background:#fff;}
.cal-events{padding:6px 18px 8px;display:flex;flex-direction:column;gap:10px;}
.cal-event-card{display:flex;gap:12px;background:var(--white);border:1px solid var(--border);border-radius:13px;padding:12px;}
.cal-event-date{flex-shrink:0;width:44px;text-align:center;}
.cal-event-date .d{font-size:1.1rem;font-weight:800;color:var(--primary);line-height:1;}
.cal-event-date .m{font-size:.65rem;color:var(--gray);font-weight:600;}
.cal-event-body .t{font-size:.85rem;font-weight:700;margin-bottom:3px;}
.cal-event-body .desc{font-size:.76rem;color:var(--gray);line-height:1.4;}

/* ── MY PAGE ── */
.my-hd{padding:24px 20px 6px;}
.my-title{font-size:1.3rem;font-weight:800;margin-bottom:4px;}
.my-sub{font-size:.8rem;color:var(--gray);}
.my-tabs{display:flex;gap:0;padding:16px 18px 0;border-bottom:1px solid var(--border);margin-top:10px;}
.my-tab{padding:8px 4px;margin-right:20px;border:none;background:transparent;font-size:.84rem;font-weight:700;color:var(--gray);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;}
.my-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.nl-card{margin:16px 18px;background:linear-gradient(135deg,var(--primary),#A78BFA);border-radius:16px;padding:18px;color:#fff;}
.nl-title{font-size:.96rem;font-weight:800;margin-bottom:4px;}
.nl-sub{font-size:.76rem;opacity:.9;margin-bottom:12px;line-height:1.4;}
.nl-row{display:flex;gap:8px;}
.nl-inp{flex:1;padding:10px 12px;border-radius:10px;border:none;font-size:.8rem;outline:none;}
.nl-btn{padding:10px 16px;border-radius:10px;border:none;background:#fff;color:var(--primary);font-weight:800;font-size:.8rem;cursor:pointer;flex-shrink:0;}
.nl-status{margin-top:10px;font-size:.78rem;font-weight:700;background:rgba(255,255,255,.18);padding:8px 10px;border-radius:9px;}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--white);border-top:1px solid var(--border);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:200;}
.bn-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;padding:6px 0;cursor:pointer;color:var(--gray);font-size:.66rem;font-weight:600;-webkit-tap-highlight-color:transparent;}
.bn-btn .ic{font-size:1.15rem;}
.bn-btn.active{color:var(--primary);}

/* ── TOAST ── */
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--black);color:#fff;padding:10px 18px;border-radius:100px;font-size:.8rem;font-weight:600;opacity:0;pointer-events:none;transition:all .25s ease;z-index:500;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- HOME -->
  <div class="view active" id="view-home">
    <div class="top-hd">
      <div class="logo">캐치<span>업</span></div>
      <button class="icon-btn" onclick="go('my')">👤</button>
    </div>
    <div class="ticker-wrap" onclick="go('home')">
      <div class="ticker-label">🔥 지금</div>
      <div class="ticker-track" id="ticker-track"></div>
    </div>
    <div class="search-area">
      <div class="search-wrap">
        <span class="search-icon-l">🔍</span>
        <input class="search-inp" id="search-inp" placeholder="트렌드, 사전 단어 검색" onkeydown="if(event.key==='Enter')doSearch()"/>
      </div>
    </div>
    <div class="cat-scroll" id="cat-scroll"></div>
    <div class="list-wrap" id="home-list"></div>
  </div>

  <!-- SEARCH RESULTS -->
  <div class="view" id="view-search">
    <div class="nav-bar">
      <button class="back-btn" onclick="go('home')">←</button>
      <div class="search-wrap">
        <span class="search-icon-l">🔍</span>
        <input class="search-inp" id="search-inp2" placeholder="트렌드, 사전 단어 검색" onkeydown="if(event.key==='Enter')doSearch()"/>
      </div>
    </div>
    <div class="section-label" id="search-summary"></div>
    <div class="list-wrap" id="search-art-list"></div>
    <div class="section-label" id="search-dict-label" style="display:none;">요즘어 사전</div>
    <div class="dict-list" id="search-dict-list"></div>
  </div>

  <!-- ARTICLE DETAIL -->
  <div class="view" id="view-article">
    <div class="nav-bar">
      <button class="back-btn" onclick="goBack()">←</button>
      <div class="nav-spacer"></div>
      <button class="icon-btn" id="bookmark-btn" onclick="toggleBookmark()">🔖</button>
    </div>
    <div class="art-detail" id="article-content"></div>
    <div class="section-label">관련 트렌드</div>
    <div class="list-wrap" id="related-list"></div>
  </div>

  <!-- DICTIONARY -->
  <div class="view" id="view-dictionary">
    <div class="nav-bar">
      <div class="nav-title">요즘어 사전</div>
    </div>
    <div class="search-area" style="padding-bottom:0;">
      <div class="search-wrap">
        <span class="search-icon-l">🔍</span>
        <input class="search-inp" id="dict-search-inp" placeholder="사전에서 단어 검색" oninput="renderDictionary()"/>
      </div>
    </div>
    <div class="cat-scroll" id="dict-cat-scroll"></div>
    <div class="dict-list" id="dict-list"></div>
  </div>

  <!-- CALENDAR -->
  <div class="view" id="view-calendar">
    <div class="nav-bar">
      <div class="nav-title">이슈 캘린더</div>
    </div>
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="shiftMonth(-1)">‹</button>
      <div class="cal-month-label" id="cal-month-label"></div>
      <button class="cal-nav-btn" onclick="shiftMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="section-label">📌 다가오는 이슈</div>
    <div class="cal-events" id="cal-events"></div>
  </div>

  <!-- MY PAGE -->
  <div class="view" id="view-my">
    <div class="my-hd">
      <div class="my-title">마이페이지</div>
      <div class="my-sub" id="my-sub-stat"></div>
    </div>
    <div class="nl-card">
      <div class="nl-title">📬 트렌드 레터 구독</div>
      <div class="nl-sub">매주 화요일, 이번 주 놓치면 안 될 Z세대 트렌드를 정리해서 보내드려요.</div>
      <div class="nl-row" id="nl-form">
        <input class="nl-inp" id="nl-email" type="email" placeholder="이메일 주소"/>
        <button class="nl-btn" onclick="subscribeNewsletter()">구독</button>
      </div>
      <div class="nl-status" id="nl-status" style="display:none;"></div>
    </div>
    <div class="my-tabs">
      <button class="my-tab active" data-tab="bookmarks" onclick="switchMyTab('bookmarks')">북마크한 글</button>
      <button class="my-tab" data-tab="terms" onclick="switchMyTab('terms')">저장한 단어</button>
      <button class="my-tab" data-tab="history" onclick="switchMyTab('history')">최근 본 글</button>
    </div>
    <div class="list-wrap" id="my-bookmarks-list"></div>
    <div class="dict-list" id="my-terms-list" style="display:none;padding:14px 18px 8px;"></div>
    <div class="list-wrap" id="my-history-list" style="display:none;"></div>
  </div>

  <div class="bottom-nav">
    <button class="bn-btn active" data-view="home" onclick="go('home')"><span class="ic">🏠</span>홈</button>
    <button class="bn-btn" data-view="dictionary" onclick="go('dictionary')"><span class="ic">📖</span>사전</button>
    <button class="bn-btn" data-view="calendar" onclick="go('calendar')"><span class="ic">📅</span>캘린더</button>
    <button class="bn-btn" data-view="my" onclick="go('my')"><span class="ic">👤</span>마이</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ============ DATA ============ */
const CATEGORIES = ["요즘 10대","요즘 20대","소비 트렌드","마케팅","브랜드 인사이트","밈·콘텐츠"];

const ARTICLES = [
{id:1,title:"다이소 4,900원 립밤, 올려도 또 품절되는 이유",category:"소비 트렌드",badge:"hot",date:"2026-07-07",tags:["다이소","가성비뷰티","품절런"],emoji:"💄",
 summary:"저가 뷰티 상품이 올려놓기만 하면 품절되는 현상, 배경엔 '실패해도 안 아까운 가격'이 있다.",
 body:["다이소 매대에 신상 립밤이 올라오면 몇 시간 안에 품절되는 일이 반복되고 있다. 가격은 4,900원, 부담 없이 '한번 써보자'는 심리가 구매 전환을 빠르게 만든다.","특히 10대·20대는 고가 뷰티 제품보다 저가 제품을 여러 개 사서 조합하는 '레이어링' 소비를 선호한다. 실패해도 손해가 적다는 점이 반복 구매로 이어진다.","브랜드 입장에서는 낮은 가격으로 진입장벽을 낮추고, SNS 후기 확산을 통해 자연스러운 마케팅 효과를 얻는 구조다."]},
{id:2,title:"편의점 콜라보 아이스크림, 왜 줄 서서까지 사 먹을까",category:"소비 트렌드",badge:"hot",date:"2026-07-06",tags:["편의점","콜라보","한정판"],emoji:"🍦",
 summary:"기간 한정 콜라보 상품은 '지금 아니면 못 산다'는 희소성이 소비 욕구를 자극한다.",
 body:["유명 캐릭터·브랜드와 협업한 한정판 아이스크림이 출시될 때마다 편의점 앞에 줄이 생긴다. 재입고 여부가 불확실하다는 점이 오히려 구매를 앞당긴다.","한정판 상품은 SNS 인증샷 콘텐츠로도 소비된다. '샀다'는 인증 자체가 트렌드에 참여했다는 신호가 되기 때문이다.","마케팅 관점에서는 소량 생산으로 재고 부담을 줄이면서도 화제성은 극대화할 수 있는 전략으로 자리잡았다."]},
{id:3,title:"'멍 때리기 챌린지', 아무것도 안 하는 게 콘텐츠가 됐다",category:"밈·콘텐츠",badge:"rising",date:"2026-07-05",tags:["챌린지","힐링콘텐츠","무자극"],emoji:"😶",
 summary:"자극적인 콘텐츠에 지친 이용자들이 '아무 말 없이 멍 때리는' 영상에 몰리고 있다.",
 body:["빠른 편집과 자막이 가득한 숏폼 사이에서, 오히려 아무 자극도 없는 '멍 때리기' 영상이 역주행 중이다. 시청자들은 이를 '두뇌 디톡스'라 부른다.","챌린지 참여자들은 특정 장소에서 5분간 멍 때리는 모습을 촬영해 업로드한다. 편집도 자막도 없는 게 오히려 신선하다는 반응이다.","브랜드들도 이 흐름에 맞춰 '무편집·무자극' 콘셉트의 광고를 실험하기 시작했다."]},
{id:4,title:"급식 브이로그가 학교 마케팅 채널이 된 사연",category:"요즘 10대",badge:null,date:"2026-07-04",tags:["급식","브이로그","학교밈"],emoji:"🍱",
 summary:"오늘의 급식을 소개하는 브이로그가 학생들 사이 정보 공유 채널로 자리잡았다.",
 body:["일부 중고등학생들은 매일 급식 메뉴를 촬영해 짧은 영상으로 공유한다. 맛 평가와 함께 '오늘 급식 등급'을 매기는 것이 하나의 놀이가 됐다.","이 콘텐츠는 같은 학교, 나아가 다른 학교 학생들과의 비교 콘텐츠로 확장되며 지역 커뮤니티성 콘텐츠로 발전하고 있다.","급식업체들도 이 반응을 참고해 메뉴 구성에 변화를 주는 사례가 늘고 있다."]},
{id:5,title:"스터디윗미 라이브, 실시간 시청자 왜 늘었을까",category:"요즘 20대",badge:"rising",date:"2026-07-03",tags:["스터디윗미","자기관리","라이브"],emoji:"📚",
 summary:"혼자 공부하기 힘든 사람들이 '같이 공부하는 느낌'을 라이브 방송에서 찾고 있다.",
 body:["'스터디윗미(Study With Me)' 라이브는 화면 너머 누군가와 함께 공부한다는 소속감을 준다. 채팅창엔 실시간으로 공부 목표를 공유하는 이용자가 가득하다.","특히 시험 기간에는 새벽 시간대 방송의 동시 접속자가 급증하는 경향을 보인다.","자기관리 콘텐츠와 결합되며 '갓생 챌린지'의 한 축으로 자리잡았다."]},
{id:6,title:"제로슈거 음료, 편의점 매출 상위권 싹쓸이",category:"소비 트렌드",badge:"hot",date:"2026-07-02",tags:["제로슈거","헬시플레저","편의점"],emoji:"🥤",
 summary:"건강도 챙기고 맛도 즐기는 '헬시플레저' 소비가 음료 시장 판도를 바꾸고 있다.",
 body:["설탕 없이도 단맛을 즐길 수 있는 제로슈거 음료가 편의점 매출 순위 상위권을 지속적으로 차지하고 있다.","'참는 다이어트'보다 '즐기는 관리'를 선호하는 흐름이 반영된 결과로, 관련 신제품 출시도 빠르게 늘고 있다.","브랜드들은 맛의 다양화와 함께 '죄책감 없는 소비'라는 메시지를 강조하는 방향으로 마케팅을 전개하고 있다."]},
{id:7,title:"팝업스토어 대기 3시간, 그래도 가는 이유",category:"브랜드 인사이트",badge:"hot",date:"2026-07-01",tags:["팝업스토어","오프라인경험","브랜드체험"],emoji:"🏬",
 summary:"온라인으로 다 되는 시대에도 오프라인 팝업은 '경험'을 판다는 점에서 여전히 강력하다.",
 body:["긴 대기 시간에도 팝업스토어 방문이 줄지 않는다. 방문객들은 상품 구매보다 '그 공간에 다녀왔다는 경험' 자체를 목적으로 삼는다.","포토존, 한정판 굿즈, SNS 인증 이벤트가 결합되면서 팝업스토어는 단순 판매 공간을 넘어 콘텐츠 생산 공간이 됐다.","브랜드는 짧은 기간에 강한 화제성을 만들 수 있다는 점에서 팝업스토어를 핵심 마케팅 채널로 활용하고 있다."]},
{id:8,title:"다꾸(다이어리 꾸미기), 디지털 시대에 왜 다시 유행할까",category:"밈·콘텐츠",badge:"rising",date:"2026-06-30",tags:["다꾸","아날로그감성","취향소비"],emoji:"📔",
 summary:"디지털 기록이 익숙한 세대일수록 손으로 직접 꾸미는 아날로그 취미에 매력을 느낀다.",
 body:["스티커와 마스킹테이프로 다이어리를 꾸미는 '다꾸'가 다시 인기를 얻고 있다. 완성된 다이어리는 SNS에 인증되며 취향을 드러내는 수단이 된다.","디지털에 익숙한 세대일수록 오히려 손으로 만지고 완성하는 과정에서 만족감을 느낀다는 분석이 나온다.","관련 문구·스티커 브랜드들은 한정판 굿즈를 출시하며 팬덤 소비를 유도하고 있다."]},
{id:9,title:"OTT 대신 '숏폼 드라마'를 보는 사람들",category:"요즘 20대",badge:"hot",date:"2026-06-29",tags:["숏폼드라마","세로형콘텐츠","빠른소비"],emoji:"📱",
 summary:"1분 안에 기승전결이 끝나는 세로형 드라마가 짧은 시청 습관에 맞아 떨어졌다.",
 body:["긴 러닝타임의 OTT 콘텐츠 대신, 한 편에 1~3분인 세로형 숏폼 드라마 시청이 늘고 있다. 자투리 시간에 여러 편을 몰아보는 방식이 일반화됐다.","전개 속도가 빠르고 자극적인 전환이 많아 다음 편을 계속 보게 만드는 구조가 특징이다.","콘텐츠 제작사들은 광고와 결합한 숏폼 드라마 포맷을 늘리며 새로운 마케팅 채널로 실험하고 있다."]},
{id:10,title:"무지출 챌린지 인증, 절약이 콘텐츠가 되는 법",category:"요즘 20대",badge:null,date:"2026-06-28",tags:["무지출챌린지","재테크","짠테크"],emoji:"💸",
 summary:"하루 지출 0원을 인증하는 챌린지가 재테크 콘텐츠의 새로운 흐름을 만들고 있다.",
 body:["하루 동안 한 푼도 쓰지 않은 것을 인증하는 '무지출 챌린지'가 SNS에서 꾸준히 공유되고 있다. 절약이 놀이처럼 소비되는 모습이다.","참여자들은 냉장고 파먹기, 도보 이동 등 구체적인 절약 방법을 함께 공유하며 커뮤니티를 형성한다.","금융 관련 브랜드들은 이 흐름에 맞춰 절약 습관을 지원하는 앱 기능을 강조하는 마케팅을 펼치고 있다."]},
{id:11,title:"중고거래 앱에서 '스몰럭셔리' 사는 사람들",category:"소비 트렌드",badge:"rising",date:"2026-06-27",tags:["중고거래","스몰럭셔리","가치소비"],emoji:"🛍️",
 summary:"작은 사치를 합리적인 가격에 즐기려는 소비자들이 중고 명품 액세서리로 눈을 돌리고 있다.",
 body:["가방 대신 키링, 스카프 같은 작은 명품 아이템을 중고로 구매하는 사례가 늘고 있다. 적은 예산으로도 브랜드 경험을 할 수 있다는 점이 매력이다.","이런 소비는 '플렉스'보다는 '합리적인 자기만족'에 가깝다는 점에서 기존 명품 소비와 결이 다르다.","중고거래 플랫폼들은 이 수요를 겨냥해 명품 전문 카테고리를 강화하고 있다."]},
{id:12,title:"회사 대신 '갓생 챌린지' 인증하는 20대",category:"요즘 20대",badge:"hot",date:"2026-06-26",tags:["갓생","자기관리","챌린지"],emoji:"⏰",
 summary:"기상부터 운동, 공부까지 하루 루틴을 인증하며 스스로를 동기부여하는 문화가 확산 중이다.",
 body:["미라클모닝, 오운완(오늘 운동 완료) 인증처럼 하루 루틴을 공개하는 '갓생 챌린지'가 20대 사이에서 꾸준히 이어지고 있다.","혼자보다 여럿이 함께 인증할 때 지속률이 높다는 점에서, 관련 챌린지 앱과 커뮤니티도 함께 성장하고 있다.","브랜드들은 갓생 루틴에 필요한 제품(수면, 운동, 다이어리)을 묶어 마케팅하는 전략을 취하고 있다."]},
{id:13,title:"탕후루 다음은 '요아정', 커스텀 디저트 전쟁",category:"소비 트렌드",badge:"hot",date:"2026-06-25",tags:["요아정","커스텀디저트","유행주기"],emoji:"🍨",
 summary:"직접 조합을 고르는 '커스텀형' 디저트가 유행의 새로운 공식으로 떠올랐다.",
 body:["요거트에 토핑을 직접 골라 조합하는 '요아정'류 디저트가 SNS에서 화제다. 나만의 조합을 완성해 인증하는 재미가 확산의 핵심이다.","유행 주기가 짧아진 디저트 시장에서, 소비자가 직접 참여할 수 있는 '커스터마이징' 요소가 다음 유행의 공통 조건으로 꼽힌다.","프랜차이즈들은 이 흐름을 반영해 셀프 조합형 메뉴를 빠르게 늘리는 추세다."]},
{id:14,title:"브랜드 굿즈, 되팔이 시장이 이렇게 커질 줄이야",category:"브랜드 인사이트",badge:"rising",date:"2026-06-24",tags:["굿즈","리셀","한정판마케팅"],emoji:"🧸",
 summary:"한정판 굿즈의 리셀 가격이 정가를 뛰어넘는 현상이 오히려 브랜드 화제성을 키운다.",
 body:["카페·편의점 협업 굿즈가 품절되면 중고거래 플랫폼에서 정가의 몇 배로 거래되는 일이 흔해졌다. 이 현상 자체가 뉴스가 되며 브랜드를 알린다.","리셀 시장이 커질수록 브랜드는 '이 굿즈를 못 구하면 손해'라는 인식을 자연스럽게 만들어낸다.","일부 브랜드는 의도적으로 소량만 생산해 리셀 화제성을 마케팅 전략으로 활용하기도 한다."]},
{id:15,title:"AI 프로필 챌린지, 왜 다들 한 번씩 해봤을까",category:"밈·콘텐츠",badge:null,date:"2026-06-23",tags:["AI프로필","챌린지","이미지생성"],emoji:"🤖",
 summary:"손쉽게 만들 수 있는 AI 생성 프로필 사진이 SNS 프로필 교체 놀이로 확산됐다.",
 body:["사진 몇 장만 올리면 다양한 스타일의 프로필 사진을 만들어주는 서비스가 유행하며, SNS 프로필 사진을 교체하는 놀이가 확산됐다.","완성된 이미지를 서로 비교하고 반응을 남기는 과정 자체가 콘텐츠가 되어, 낮은 진입장벽에도 확산 속도가 빨랐다.","관련 서비스들은 이 흐름을 타고 무료 체험 후 유료 전환을 유도하는 마케팅을 적극적으로 펼쳤다."]},
{id:16,title:"전공책 대신 '요약노트'가 거래되는 캠퍼스 장터",category:"요즘 20대",badge:null,date:"2026-06-22",tags:["요약노트","캠퍼스","중고거래"],emoji:"📝",
 summary:"직접 정리한 강의 요약노트가 중고거래 플랫폼에서 활발히 거래되고 있다.",
 body:["시험 기간이 다가오면 대학 커뮤니티와 중고거래 앱에는 강의 요약노트 판매 글이 쏟아진다. 잘 정리된 노트는 빠르게 거래가 성사된다.","단순 판매를 넘어 '노트 품질 후기'가 공유되면서 일부 판매자는 시리즈로 노트를 제작해 판매하기도 한다.","이 현상은 정보를 가공해 가치를 만드는 '콘텐츠형 거래'의 한 사례로 주목받고 있다."]},
{id:17,title:"지하철 밈 광고, 왜 캡처해서 퍼가는 걸까",category:"마케팅",badge:"rising",date:"2026-06-21",tags:["밈마케팅","지하철광고","B급감성"],emoji:"🚇",
 summary:"진지하지 않고 허를 찌르는 카피의 지하철 광고가 캡처되어 SNS를 타고 확산되고 있다.",
 body:["과장되거나 허를 찌르는 유머 코드를 담은 지하철 광고가 승객들의 캡처를 유도하며 온라인으로 확산되고 있다.","'너무 진지하지 않은' B급 감성의 카피가 오히려 브랜드에 대한 호감을 높인다는 반응이 많다.","브랜드 담당자들은 이 흐름을 참고해 오프라인 광고 카피에도 밈적인 유머를 적극적으로 반영하고 있다."]},
{id:18,title:"댓글창이 본편? '드립 마케팅' 성공 사례",category:"마케팅",badge:"hot",date:"2026-06-20",tags:["드립마케팅","댓글마케팅","브랜드텐션"],emoji:"💬",
 summary:"공식 계정이 댓글창에서 재치있게 반응하는 것만으로도 화제성과 호감도가 동시에 올라간다.",
 body:["일부 브랜드 공식 SNS 계정은 게시물보다 댓글 답변으로 더 큰 화제를 모은다. 이용자의 드립에 위트있게 맞받아치는 반응이 캡처되어 퍼진다.","이런 '드립 마케팅'은 큰 예산 없이도 브랜드에 친근한 이미지를 심어줄 수 있다는 점에서 담당자들의 관심을 받고 있다.","다만 과도한 드립은 브랜드 톤과 맞지 않을 경우 역효과가 날 수 있어 균형이 중요하다는 지적도 나온다."]}
];

/* ============ STATE ============ */
const STORE_KEY = 'catchup_state_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return Object.assign({bookmarks:[],savedTerms:[],history:[],subscribed:false,email:''}, JSON.parse(raw));
  }catch(e){}
  return {bookmarks:[],savedTerms:[],history:[],subscribed:false,email:''};
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
let state = loadState();

/* ============ NAV ============ */
function go(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  document.querySelectorAll('.bn-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  if(view==='home') renderHome();
  if(view==='dictionary') renderDictionary();
  if(view==='calendar') renderCalendar();
  if(view==='my') renderMy();
}
function goBack(){ go(cameFrom); }

/* ============ TOAST ============ */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ============ TICKER ============ */
let tickerIdx = 0, tickerTimer;
function renderTicker(){
  const track = document.getElementById('ticker-track');
  track.innerHTML = MICRO_TRENDS.map((m,i)=>{
    const parts = m.split(' · ');
    return `<div class="ticker-item${i===0?' show':''}" data-i="${i}">${parts[0]}<span class="ticker-time"> · ${parts[1]}</span></div>`;
  }).join('');
  clearInterval(tickerTimer);
  tickerTimer = setInterval(()=>{
    const items = track.querySelectorAll('.ticker-item');
    items[tickerIdx].classList.remove('show');
    tickerIdx = (tickerIdx+1) % items.length;
    items[tickerIdx].classList.add('show');
  }, 3200);
}

function renderCatChips(targetId, onClickName){
  const el = document.getElementById(targetId);
  const cats = ["전체", ...CATEGORIES];
  el.innerHTML = cats.map(c=>`<button class="cat-chip${c===currentCat?' sel':''}" onclick="${onClickName}('${c}')">${c}</button>`).join('');

function selectCat(c){ currentCat = c; renderHome(); }

function badgeHtml(badge){
  if(badge==='hot') return '<span class="badge badge-hot">🔥 유행중</span>';
  if(badge==='rising') return '<span class="badge badge-rising">👀 예감</span>';
  return '';
}
function artCardHtml(a){
  return `<div class="art-card" onclick="openArticle(${a.id},'${cameFromForCard()}')">
    <div class="art-thumb">${a.emoji}</div>
    <div class="art-body">
      <div class="art-badges">${badgeHtml(a.badge)}<span class="badge badge-cat">${a.category}</span></div>

}

  const activeView = document.querySelector('.view.active');

}

  renderTicker();

  const list = currentCat==='전체' ? ARTICLES : ARTICLES.filter(a=>a.category===currentCat);
  const sorted = [...list].sort((a,b)=> b.date.localeCompare(a.date));
  const el = document.getElementById('home-list');
  el.innerHTML = sorted.length ? sorted.map(artCardHtml).join('') : '<div class="empty-state">해당 카테고리 콘텐츠가 아직 없어요.</div>';

/* ============ SEARCH ============ */
function doSearch(){
  const q1 = document.getElementById('search-inp').value.trim();
  const q2 = document.getElementById('search-inp2') ? document.getElementById('search-inp2').value.trim() : '';
  const q = (q1 || q2);
  if(!q){ toast('검색어를 입력해주세요'); return; }
  go('search');
  document.getElementById('search-inp2').value = q;
  runSearch(q);
}
function runSearch(q){
  const query = q.toLowerCase();
  const artResults = ARTICLES.filter(a =>
    a.title.toLowerCase().includes(query) ||
    a.summary.toLowerCase().includes(query) ||
    a.tags.some(t=>t.toLowerCase().includes(query)) ||
    a.category.toLowerCase().includes(query)
  );
  const dictResults = DICTIONARY.filter(d =>
    d.term.toLowerCase().includes(query) || d.meaning.toLowerCase().includes(query)
  );
  document.getElementById('search-summary').textContent = `"${q}" 검색 결과 · 트렌드 ${artResults.length}건`;
  document.getElementById('search-art-list').innerHTML = artResults.length ? artResults.map(artCardHtml).join('') : '<div class="empty-state">일치하는 트렌드가 없어요.</div>';
  const dictLabel = document.getElementById('search-dict-label');
  const dictList = document.getElementById('search-dict-list');
  if(dictResults.length){
    dictLabel.style.display='block';
    dictList.innerHTML = dictResults.map(d=>dictCardHtml(d)).join('');
  } else {
    dictLabel.style.display='none';
    dictList.innerHTML='';
  }
}

/* ============ ARTICLE DETAIL ============ */
function openArticle(id, from){
  currentArticleId = id;
  cameFrom = from || 'home';
  const a = ARTICLES.find(x=>x.id===id);
  if(!a) return;
  if(!state.history.includes(id)){
    state.history.unshift(id);
    state.history = state.history.slice(0,20);
  } else {
    state.history = [id, ...state.history.filter(h=>h!==id)];
  }
  saveState();
  document.getElementById('article-content').innerHTML = `
    <span class="detail-cat">${a.category}</span>
    ${badgeHtml(a.badge)}
    <div class="detail-title">${a.title}</div>
    <div class="detail-meta">${a.date} · 캐치업 트렌드팀</div>
    <div class="detail-thumb">${a.emoji}</div>
    <div class="detail-body">${a.body.map(p=>`<p>${p}</p>`).join('')}</div>
    <div class="tag-row">${a.tags.map(t=>`<span class="tag-chip">#${t}</span>`).join('')}</div>
  `;
  updateBookmarkBtn();
  const related = ARTICLES.filter(x=>x.category===a.category && x.id!==a.id).slice(0,3);
  document.getElementById('related-list').innerHTML = related.length ? related.map(artCardHtml).join('') : '<div class="empty-state">관련 트렌드가 없어요.</div>';
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-article').classList.add('active');
}
function updateBookmarkBtn(){
  const btn = document.getElementById('bookmark-btn');
  btn.classList.toggle('on', state.bookmarks.includes(currentArticleId));
}
function toggleBookmark(){
  if(currentArticleId==null) return;
  if(state.bookmarks.includes(currentArticleId)){
    state.bookmarks = state.bookmarks.filter(id=>id!==currentArticleId);
    toast('북마크를 해제했어요');
  } else {
    state.bookmarks.push(currentArticleId);
    toast('북마크에 저장했어요');
  }
  saveState();
  updateBookmarkBtn();
}

/* ============ DICTIONARY ============ */
const DICT_TAGS = [...new Set(DICTIONARY.map(d=>d.tag))];
let currentDictTag = "전체";
function selectDictTag(t){ currentDictTag = t; renderDictionary(); }
function dictCardHtml(d){
  return `<div class="dict-card">
    <div onclick="toggleDictCard(this)">
      <div class="dict-term-row"><span class="dict-term">${d.term}</span><span class="dict-tag">${d.tag}</span></div>
      <div class="dict-meaning">${d.meaning}</div>
    </div>
    <div class="dict-detail">
      <div class="dict-detail-row"><span class="dict-detail-label">유래</span>${d.origin}</div>
      <div class="dict-detail-row"><span class="dict-detail-label">예문</span>"${d.example}"</div>
      <button class="dict-save-btn${state.savedTerms.includes(d.id)?' on':''}" data-term-id="${d.id}" onclick="event.stopPropagation();toggleSaveTerm(${d.id})">${state.savedTerms.includes(d.id)?'✓ 저장됨':'+ 단어 저장'}</button>
    </div>
  </div>`;
}
function toggleDictCard(innerEl){
  const card = innerEl.closest('.dict-card');
  const list = card.parentElement;
  Array.from(list.children).forEach(c=>{
    if(c!==card && c.classList.contains('dict-card')) c.classList.remove('open');
  });
  card.classList.toggle('open');
}
function toggleSaveTerm(id){
  const nowSaved = !state.savedTerms.includes(id);
  if(nowSaved){
    state.savedTerms.push(id);
    toast('사전 단어를 저장했어요');
  } else {
    state.savedTerms = state.savedTerms.filter(t=>t!==id);
    toast('저장한 단어에서 제거했어요');
  }
  saveState();
  document.querySelectorAll(`.dict-save-btn[data-term-id="${id}"]`).forEach(b=>{
    b.classList.toggle('on', nowSaved);
    b.textContent = nowSaved ? '✓ 저장됨' : '+ 단어 저장';
  });
  if(document.getElementById('view-my').classList.contains('active')) renderMy();
}
function renderDictionary(){
  const q = (document.getElementById('dict-search-inp').value||'').toLowerCase().trim();
  const catsEl = document.getElementById('dict-cat-scroll');
  const cats = ["전체", ...DICT_TAGS];
  catsEl.innerHTML = cats.map(c=>`<button class="cat-chip${c===currentDictTag?' sel':''}" onclick="selectDictTag('${c}')">${c}</button>`).join('');
  let list = currentDictTag==='전체' ? DICTIONARY : DICTIONARY.filter(d=>d.tag===currentDictTag);
  if(q) list = list.filter(d=>d.term.toLowerCase().includes(q) || d.meaning.toLowerCase().includes(q));
  const el = document.getElementById('dict-list');
  el.innerHTML = list.length ? list.map(dictCardHtml).join('') : '<div class="empty-state">일치하는 단어가 없어요.</div>';
}

/* ============ CALENDAR ============ */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function shiftMonth(delta){
  calMonth += delta;
  if(calMonth<0){ calMonth=11; calYear--; }
  if(calMonth>11){ calMonth=0; calYear++; }
  calSelDate = null;
  renderCalendar();
}
function renderCalendar(){
  const label = document.getElementById('cal-month-label');
  label.textContent = `${calYear}년 ${calMonth+1}월`;
  const grid = document.getElementById('cal-grid');
  const dow = ['일','월','화','수','목','금','토'];
  let html = dow.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first = new Date(calYear, calMonth, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  const eventDates = new Set(CAL_EVENTS.map(e=>e.date));
  for(let i=0;i<startDay;i++) html += '<div class="cal-cell"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${calYear}-${pad(calMonth+1)}-${pad(d)}`;
    const isToday = dateStr===todayStr;
    const isSel = dateStr===calSelDate;
    const hasEvent = eventDates.has(dateStr);
    html += `<div class="cal-cell${hasEvent?' has-day':''}${isToday?' today':''}${isSel?' sel':''}" onclick="${hasEvent?`selectCalDate('${dateStr}')`:''}">${d}${hasEvent?'<span class=\"cal-dot\"></span>':''}</div>`;
  }
  grid.innerHTML = html;
  renderCalEvents();
}
function selectCalDate(dateStr){
  calSelDate = calSelDate===dateStr ? null : dateStr;
  renderCalendar();
}
function renderCalEvents(){
  const el = document.getElementById('cal-events');
  let events = CAL_EVENTS;
  if(calSelDate){
    events = events.filter(e=>e.date===calSelDate);
  } else {
    const monthPrefix = `${calYear}-${pad(calMonth+1)}`;
    events = events.filter(e=>e.date.startsWith(monthPrefix));
    if(!events.length) events = CAL_EVENTS.slice(0,5);
  }
  events = [...events].sort((a,b)=>a.date.localeCompare(b.date));
  const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  el.innerHTML = events.length ? events.map(e=>{
    const [y,m,d] = e.date.split('-');
    return `<div class="cal-event-card">
      <div class="cal-event-date"><div class="d">${parseInt(d)}</div><div class="m">${monthNames[parseInt(m)-1]}</div></div>
      <div class="cal-event-body"><div class="t">${e.title}</div><div class="desc">${e.desc}</div></div>
    </div>`;
  }).join('') : '<div class="empty-state">해당 날짜에 등록된 이슈가 없어요.</div>';
}

/* ============ MY PAGE ============ */
let myTab = 'bookmarks';
function switchMyTab(tab){
  myTab = tab;
  document.querySelectorAll('.my-tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('my-bookmarks-list').style.display = tab==='bookmarks' ? 'flex' : 'none';
  document.getElementById('my-terms-list').style.display = tab==='terms' ? 'flex' : 'none';
  document.getElementById('my-history-list').style.display = tab==='history' ? 'flex' : 'none';
}
function renderMy(){
  document.getElementById('my-sub-stat').textContent = `북마크 ${state.bookmarks.length} · 저장한 단어 ${state.savedTerms.length} · 최근 본 글 ${state.history.length}`;
  const bmList = ARTICLES.filter(a=>state.bookmarks.includes(a.id));
  document.getElementById('my-bookmarks-list').innerHTML = bmList.length ? bmList.map(artCardHtml).join('') : '<div class="empty-state">아직 북마크한 트렌드가 없어요.<br>마음에 드는 글을 저장해보세요!</div>';
  const termList = DICTIONARY.filter(d=>state.savedTerms.includes(d.id));
  document.getElementById('my-terms-list').innerHTML = termList.length ? termList.map(dictCardHtml).join('') : '<div class="empty-state">아직 저장한 단어가 없어요.</div>';
  const histList = state.history.map(id=>ARTICLES.find(a=>a.id===id)).filter(Boolean);
  document.getElementById('my-history-list').innerHTML = histList.length ? histList.map(artCardHtml).join('') : '<div class="empty-state">최근 본 글이 없어요.</div>';
  switchMyTab(myTab);
  const nlForm = document.getElementById('nl-form');
  const nlStatus = document.getElementById('nl-status');
  if(state.subscribed){
    nlForm.style.display='none';
    nlStatus.style.display='block';
    nlStatus.textContent = `✅ ${state.email} 로 매주 화요일 트렌드 레터가 발송돼요`;
  } else {
    nlForm.style.display='flex';
    nlStatus.style.display='none';
  }
}
function subscribeNewsletter(){
  const email = document.getElementById('nl-email').value.trim();
  const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!re.test(email)){ toast('올바른 이메일을 입력해주세요'); return; }
  state.subscribed = true;
  state.email = email;
  saveState();
  toast('구독 완료! 매주 화요일에 만나요 📬');
  renderMy();
}

/* ============ INIT ============ */
renderHome();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
