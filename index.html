<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>캐치업 글로벌 — 유럽 트렌드 레이더</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#1D4ED8"/>
<meta name="description" content="유럽 Z세대 트렌드를 한 곳에서 캐치업하는 글로벌 트렌드 앱. European Gen-Z trend radar."/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' fill='%231D4ED8' rx='40'/><circle cx='96' cy='96' r='52' fill='none' stroke='white' stroke-width='11' opacity='0.95'/><circle cx='96' cy='96' r='10' fill='white'/><path d='M96 96L138 62' stroke='white' stroke-width='11' stroke-linecap='round'/></svg>"/>
<style>
:root{
  --bg:#F8FAFC; --white:#fff; --black:#0F172A;
  --primary:#1D4ED8; --primary-dark:#1E40AF; --primary-light:#EFF4FF;
  --accent:#F59E0B; --accent-bg:#FEF3C7;
  --info:#0EA5E9; --info-bg:#E0F2FE;
  --gray:#64748B; --gray-light:#F1F5F9; --border:#E2E8F0;
  --font:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Segoe UI','Malgun Gothic',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--black);min-height:100dvh;-webkit-font-smoothing:antialiased;}
button,input{font-family:var(--font);}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;}
.view{display:none;flex-direction:column;flex:1;padding-bottom:70px;}
.view.active{display:flex;animation:fadeUp .18s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── HEADER / NAV ── */
.top-hd{padding:18px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.logo{font-size:1.3rem;font-weight:800;letter-spacing:-.03em;flex:1;}
.logo span{color:var(--primary);}
.lang-btn{padding:7px 12px;border-radius:100px;border:2px solid var(--border);background:var(--white);font-size:.72rem;font-weight:800;color:var(--gray);cursor:pointer;letter-spacing:.05em;-webkit-tap-highlight-color:transparent;}
.nav-bar{background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;}
.back-btn,.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--gray-light);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
.icon-btn.on{background:var(--primary-light);color:var(--primary);}
.nav-title{font-size:1rem;font-weight:700;flex:1;}
.nav-spacer{flex:1;}

/* ── TICKER ── */
.ticker-wrap{margin:16px 18px 4px;background:var(--black);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px;overflow:hidden;cursor:pointer;}
.ticker-label{font-size:.68rem;font-weight:700;color:var(--accent);letter-spacing:.04em;flex-shrink:0;white-space:nowrap;}
.ticker-track{flex:1;overflow:hidden;position:relative;height:18px;}
.ticker-item{position:absolute;inset:0;color:#fff;font-size:.78rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .4s ease;}
.ticker-item.show{opacity:1;}
.ticker-time{color:#94A3B8;margin-left:6px;}

/* ── SEARCH ── */
.search-area{padding:14px 18px 0;display:flex;gap:8px;}
.search-wrap{flex:1;position:relative;}
.search-inp{width:100%;padding:12px 14px 12px 40px;border-radius:12px;border:2px solid var(--border);font-size:.86rem;background:var(--white);color:var(--black);outline:none;transition:border-color .2s;}
.search-inp:focus{border-color:var(--primary);}
.search-icon-l{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--gray);pointer-events:none;font-size:.95rem;}

/* ── CHIP ROWS ── */
.cat-scroll{display:flex;gap:8px;padding:14px 18px 2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-chip{flex-shrink:0;padding:8px 15px;border-radius:100px;border:2px solid var(--border);background:var(--white);font-size:.8rem;font-weight:600;color:var(--gray);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.cat-chip.sel{border-color:var(--primary);background:var(--primary);color:#fff;}
.region-scroll{padding-top:8px;}
.region-scroll .cat-chip.sel{border-color:var(--accent);background:var(--accent-bg);color:#92400E;}

/* ── ARTICLE LIST ── */
.list-wrap{padding:14px 18px 8px;display:flex;flex-direction:column;gap:12px;}
.art-card{display:flex;gap:12px;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:13px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .1s;}
.art-card:active{transform:scale(.98);}
.art-thumb{width:62px;height:62px;border-radius:12px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex-shrink:0;}
.art-body{flex:1;min-width:0;}
.art-badges{display:flex;gap:5px;margin-bottom:5px;flex-wrap:wrap;}
.badge{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em;}
.badge-hot{background:#FEE2E2;color:#DC2626;}
.badge-rising{background:var(--info-bg);color:var(--info);}
.badge-cat{background:var(--gray-light);color:var(--gray);}
.badge-region{background:var(--accent-bg);color:#92400E;}
.art-title{font-size:.9rem;font-weight:700;line-height:1.35;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.art-summary{font-size:.76rem;color:var(--gray);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;margin-bottom:5px;}
.art-meta{font-size:.7rem;color:#94A3B8;}
.empty-state{padding:40px 20px;text-align:center;color:var(--gray);font-size:.85rem;line-height:1.6;}

/* ── ARTICLE DETAIL ── */
.art-detail{padding:6px 20px 24px;}
.detail-cat{display:inline-block;font-size:.72rem;font-weight:700;color:var(--primary);background:var(--primary-light);padding:4px 10px;border-radius:8px;margin-bottom:12px;margin-right:6px;}
.detail-region{display:inline-block;font-size:.72rem;font-weight:700;color:#92400E;background:var(--accent-bg);padding:4px 10px;border-radius:8px;margin-bottom:12px;margin-right:6px;}
.detail-title{font-size:1.35rem;font-weight:800;line-height:1.35;margin-bottom:8px;}
.detail-meta{font-size:.76rem;color:var(--gray);margin-bottom:18px;}
.detail-thumb{width:100%;height:160px;border-radius:16px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:3.4rem;margin-bottom:18px;}
.detail-body p{font-size:.9rem;line-height:1.75;color:#1E293B;margin-bottom:14px;}
.tag-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;margin-bottom:22px;}
.tag-chip{font-size:.74rem;color:var(--primary);background:var(--primary-light);padding:5px 11px;border-radius:100px;font-weight:600;}
.section-label{font-size:.78rem;font-weight:700;color:var(--gray);margin:0 20px 10px;letter-spacing:.02em;}

/* ── DICTIONARY ── */
.dict-list{padding:6px 18px 8px;display:flex;flex-direction:column;gap:10px;}
.dict-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.dict-term-row{display:flex;align-items:center;gap:8px;}
.dict-term{font-size:1rem;font-weight:800;color:var(--primary);}
.dict-tag{font-size:.65rem;font-weight:700;color:var(--gray);background:var(--gray-light);padding:2px 8px;border-radius:6px;}
.dict-meaning{font-size:.8rem;color:#334155;margin-top:5px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.dict-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:none;}
.dict-card.open .dict-detail{display:block;}
.dict-detail-row{font-size:.78rem;margin-bottom:8px;line-height:1.55;}
.dict-detail-label{font-weight:700;color:var(--gray);margin-right:4px;}
.dict-save-btn{margin-top:6px;font-size:.75rem;font-weight:700;color:var(--primary);background:var(--primary-light);border:none;padding:7px 12px;border-radius:9px;cursor:pointer;}
.dict-save-btn.on{background:var(--primary);color:#fff;}

/* ── CALENDAR ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 4px;}
.cal-nav-btn{width:34px;height:34px;border-radius:9px;background:var(--gray-light);border:none;font-size:1rem;cursor:pointer;}
.cal-month-label{font-size:1.02rem;font-weight:800;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px 18px;}
.cal-dow{font-size:.68rem;color:var(--gray);text-align:center;font-weight:700;padding-bottom:4px;}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:.78rem;font-weight:600;cursor:default;position:relative;}
.cal-cell.has-day{cursor:pointer;}
.cal-cell.today{background:var(--primary);color:#fff;}
.cal-cell.sel:not(.today){background:var(--primary-light);color:var(--primary);}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;bottom:6px;}
.cal-cell.today .cal-dot{background:#fff;}
.cal-events{padding:6px 18px 8px;display:flex;flex-direction:column;gap:10px;}
.cal-event-card{display:flex;gap:12px;background:var(--white);border:1px solid var(--border);border-radius:13px;padding:12px;}
.cal-event-date{flex-shrink:0;width:44px;text-align:center;}
.cal-event-date .d{font-size:1.1rem;font-weight:800;color:var(--primary);line-height:1;}
.cal-event-date .m{font-size:.65rem;color:var(--gray);font-weight:600;}
.cal-event-body .t{font-size:.85rem;font-weight:700;margin-bottom:3px;}
.cal-event-body .desc{font-size:.76rem;color:var(--gray);line-height:1.4;}

/* ── MY PAGE ── */
.my-hd{padding:24px 20px 6px;}
.my-title{font-size:1.3rem;font-weight:800;margin-bottom:4px;}
.my-sub{font-size:.8rem;color:var(--gray);}
.my-tabs{display:flex;gap:0;padding:16px 18px 0;border-bottom:1px solid var(--border);margin-top:10px;}
.my-tab{padding:8px 4px;margin-right:20px;border:none;background:transparent;font-size:.84rem;font-weight:700;color:var(--gray);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;}
.my-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.nl-card{margin:16px 18px;background:linear-gradient(135deg,var(--primary),#60A5FA);border-radius:16px;padding:18px;color:#fff;}
.nl-title{font-size:.96rem;font-weight:800;margin-bottom:4px;}
.nl-sub{font-size:.76rem;opacity:.9;margin-bottom:12px;line-height:1.4;}
.nl-row{display:flex;gap:8px;}
.nl-inp{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:none;font-size:.8rem;outline:none;}
.nl-btn{padding:10px 16px;border-radius:10px;border:none;background:#fff;color:var(--primary);font-weight:800;font-size:.8rem;cursor:pointer;flex-shrink:0;}
.nl-consent{display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:.7rem;line-height:1.45;opacity:.92;cursor:pointer;}
.nl-consent input{margin-top:2px;accent-color:#fff;}
.nl-status{margin-top:10px;font-size:.78rem;font-weight:700;background:rgba(255,255,255,.18);padding:8px 10px;border-radius:9px;}
.nl-unsub{display:none;margin-top:8px;background:transparent;border:none;color:rgba(255,255,255,.75);font-size:.72rem;font-weight:600;cursor:pointer;text-decoration:underline;}

/* ── BOARD ── */
.board-list{padding:8px 18px;display:flex;flex-direction:column;gap:9px;}
.board-card{display:flex;align-items:center;gap:12px;background:var(--black);border-radius:13px;padding:13px 15px;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.board-rank{font-size:.82rem;font-weight:800;color:var(--accent);width:20px;flex-shrink:0;}
.board-body{flex:1;min-width:0;}
.board-text{font-size:.84rem;font-weight:600;line-height:1.4;}
.board-time{font-size:.7rem;color:#94A3B8;margin-top:2px;}
.board-arrow{color:#64748B;font-size:.85rem;flex-shrink:0;}
.board-hint{padding:4px 20px 0;font-size:.74rem;color:var(--gray);}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--white);border-top:1px solid var(--border);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:200;}
.bn-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;padding:6px 0;cursor:pointer;color:var(--gray);font-size:.66rem;font-weight:600;-webkit-tap-highlight-color:transparent;}
.bn-btn .ic{font-size:1.15rem;}
.bn-btn.active{color:var(--primary);}

/* ── CONSENT BANNER ── */
.consent-banner{position:fixed;bottom:78px;left:12px;right:12px;max-width:456px;margin:0 auto;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:15px;box-shadow:0 8px 30px rgba(15,23,42,.14);z-index:400;display:none;}
.consent-banner.show{display:block;animation:fadeUp .25s ease;}
.cb-title{font-size:.84rem;font-weight:800;margin-bottom:5px;}
.cb-text{font-size:.75rem;color:var(--gray);line-height:1.55;margin-bottom:11px;}
.cb-btn{width:100%;padding:11px;border-radius:11px;border:none;background:var(--primary);color:#fff;font-size:.82rem;font-weight:800;cursor:pointer;}

/* ── TOAST ── */
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--black);color:#fff;padding:10px 18px;border-radius:100px;font-size:.8rem;font-weight:600;opacity:0;pointer-events:none;transition:all .25s ease;z-index:500;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- HOME -->
  <div class="view active" id="view-home">
    <div class="top-hd">
      <div class="logo" data-i18n-html="logo"></div>
      <button class="lang-btn" id="lang-btn" aria-label="language" onclick="toggleLang()"></button>
      <button class="icon-btn" aria-label="my page" onclick="go('my')">👤</button>
    </div>
    <div class="ticker-wrap" role="button" aria-label="micro trend board" onclick="go('board')">
      <div class="ticker-label" data-i18n="tickerLabel"></div>
      <div class="ticker-track" id="ticker-track"></div>
    </div>
    <div class="search-area">
      <div class="search-wrap">
        <span class="search-icon-l">🔍</span>
        <input class="search-inp" id="search-inp" data-i18n-ph="searchPh" onkeydown="if(event.key==='Enter')doSearch()"/>
      </div>
    </div>
    <div class="cat-scroll" id="cat-scroll"></div>
    <div class="cat-scroll region-scroll" id="region-scroll"></div>
    <div class="list-wrap" id="home-list"></div>
  </div>

  <!-- SEARCH RESULTS -->
  <div class="view" id="view-search">
    <div class="nav-bar">
      <button class="back-btn" aria-label="back" onclick="go('home')">←</button>
      <div class="search-wrap">
        <span class="search-icon-l">🔍</span>
        <input class="search-inp" id="search-inp2" data-i18n-ph="searchPh" onkeydown="if(event.key==='Enter')doSearch()"/>
      </div>
    </div>
    <div class="section-label" id="search-summary"></div>
    <div class="list-wrap" id="search-art-list"></div>
    <div class="section-label" id="search-dict-label" style="display:none;" data-i18n="dictTitle"></div>
    <div class="dict-list" id="search-dict-list"></div>
  </div>

  <!-- ARTICLE DETAIL -->
  <div class="view" id="view-article">
    <div class="nav-bar">
      <button class="back-btn" aria-label="back" onclick="goBack()">←</button>
      <div class="nav-spacer"></div>
      <button class="icon-btn" id="bookmark-btn" aria-label="bookmark" onclick="toggleBookmark()">🔖</button>
    </div>
    <div class="art-detail" id="article-content"></div>
    <div class="section-label" data-i18n="relatedLabel"></div>
    <div class="list-wrap" id="related-list"></div>
  </div>

  <!-- DICTIONARY -->
  <div class="view" id="view-dictionary">
    <div class="nav-bar">
      <div class="nav-title" data-i18n="dictTitle"></div>
    </div>
    <div class="search-area" style="padding-bottom:0;">
      <div class="search-wrap">
        <span class="search-icon-l">🔍</span>
        <input class="search-inp" id="dict-search-inp" data-i18n-ph="dictSearchPh" oninput="renderDictionary()"/>
      </div>
    </div>
    <div class="cat-scroll" id="dict-cat-scroll"></div>
    <div class="dict-list" id="dict-list"></div>
  </div>

  <!-- CALENDAR -->
  <div class="view" id="view-calendar">
    <div class="nav-bar">
      <div class="nav-title" data-i18n="calTitle"></div>
    </div>
    <div class="cal-nav">
      <button class="cal-nav-btn" aria-label="previous month" onclick="shiftMonth(-1)">‹</button>
      <div class="cal-month-label" id="cal-month-label"></div>
      <button class="cal-nav-btn" aria-label="next month" onclick="shiftMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="section-label" data-i18n="upcoming"></div>
    <div class="cal-events" id="cal-events"></div>
  </div>

  <!-- MICRO TREND BOARD -->
  <div class="view" id="view-board">
    <div class="nav-bar">
      <button class="back-btn" aria-label="back" onclick="go('home')">←</button>
      <div class="nav-title" data-i18n="boardTitle"></div>
    </div>
    <div class="board-hint" data-i18n="boardHint"></div>
    <div class="board-list" id="board-list"></div>
  </div>

  <!-- MY PAGE -->
  <div class="view" id="view-my">
    <div class="my-hd">
      <div class="my-title" data-i18n="myTitle"></div>
      <div class="my-sub" id="my-sub-stat"></div>
    </div>
    <div class="nl-card">
      <div class="nl-title" data-i18n="nlTitle"></div>
      <div class="nl-sub" data-i18n="nlSub"></div>
      <div id="nl-form">
        <div class="nl-row">
          <input class="nl-inp" id="nl-email" type="email" data-i18n-ph="nlPh"/>
          <button class="nl-btn" onclick="subscribeNewsletter()" data-i18n="nlBtn"></button>
        </div>
        <label class="nl-consent"><input type="checkbox" id="nl-consent-chk"/><span data-i18n="nlConsent"></span></label>
      </div>
      <div class="nl-status" id="nl-status" style="display:none;"></div>
      <button class="nl-unsub" id="nl-unsub" onclick="unsubscribeNewsletter()" data-i18n="nlUnsub"></button>
    </div>
    <div class="my-tabs">
      <button class="my-tab active" data-tab="bookmarks" onclick="switchMyTab('bookmarks')" data-i18n="tabBookmarks"></button>
      <button class="my-tab" data-tab="terms" onclick="switchMyTab('terms')" data-i18n="tabTerms"></button>
      <button class="my-tab" data-tab="history" onclick="switchMyTab('history')" data-i18n="tabHistory"></button>
    </div>
    <div class="list-wrap" id="my-bookmarks-list"></div>
    <div class="dict-list" id="my-terms-list" style="display:none;padding:14px 18px 8px;"></div>
    <div class="list-wrap" id="my-history-list" style="display:none;"></div>
  </div>

  <div class="bottom-nav">
    <button class="bn-btn active" data-view="home" onclick="go('home')"><span class="ic">🏠</span><span data-i18n="navHome"></span></button>
    <button class="bn-btn" data-view="dictionary" onclick="go('dictionary')"><span class="ic">📖</span><span data-i18n="navDict"></span></button>
    <button class="bn-btn" data-view="calendar" onclick="go('calendar')"><span class="ic">📅</span><span data-i18n="navCal"></span></button>
    <button class="bn-btn" data-view="my" onclick="go('my')"><span class="ic">👤</span><span data-i18n="navMy"></span></button>
  </div>

  <div class="consent-banner" id="consent-banner">
    <div class="cb-title" data-i18n="cbTitle"></div>
    <div class="cb-text" data-i18n="cbText"></div>
    <button class="cb-btn" id="consent-accept" onclick="acceptConsent()" data-i18n="cbBtn"></button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ============ I18N STRINGS ============ */
const STRINGS = {
ko:{
  logo:"캐치업 <span>글로벌</span>", tickerLabel:"🔥 지금 유럽",
  searchPh:"유럽 트렌드, 슬랭 검색", dictSearchPh:"슬랭 사전에서 검색",
  navHome:"홈", navDict:"사전", navCal:"캘린더", navMy:"마이",

  summary:"로고 대신 소재와 실루엣. 파리 Z세대는 새 명품 대신 빈티지에서 조용한 럭셔리를 찾는다.",
  body:["파리의 빈티지 숍과 중고 마켓에서 로고가 드러나지 않는 고급 소재의 옷을 찾는 젊은 손님이 늘고 있다. 브랜드를 과시하기보다 아는 사람만 알아보는 절제된 스타일이 지지를 얻는 분위기다.","이 흐름은 새 제품 구매보다 빈티지 발굴을 '취향의 증명'으로 여기는 소비 문화와 맞닿아 있다. 희소한 아카이브 아이템을 찾아내는 과정 자체가 콘텐츠로 공유된다.","럭셔리 브랜드들도 아카이브 재발매와 수선 서비스를 강화하며, 소유의 과시가 아닌 '오래 입는 안목'을 강조하는 메시지로 이동하고 있다."]},

  body:["영국 곳곳의 채리티숍(기부 물품 중고 매장)에서 단돈 몇 파운드로 찾아낸 아이템을 소개하는 '하울' 영상이 꾸준히 인기다. 낮은 가격과 의외의 발견이 콘텐츠의 핵심 재미다.","기부 기반 소비라는 점에서 죄책감 없는 쇼핑으로 받아들여지고, 환경 부담을 줄인다는 명분도 함께 소비된다.","일부 채리티 단체는 인기 크리에이터와 협업해 매장 방문을 유도하는 캠페인을 열며, 기부 순환 구조 자체를 마케팅 자산으로 활용하기 시작했다."]},

  summary:"Treasure-hunt videos filmed in local charity shops are filling British short-form feeds.",

  body:["베를린의 심야 편의점 '슈페티(Späti)' 앞 벤치에서 음료 한 병을 놓고 시간을 보내는 문화가 다시 조명받고 있다. 물가 부담 속에서 저렴하게 어울릴 수 있는 공간이기 때문이다.","클럽이나 바 대신 슈페티 앞에서 만나는 모습은 '꾸미지 않은 진짜 베를린'을 상징하는 이미지로 소비되며, 여행자들의 체험 콘텐츠로도 확산 중이다.","로컬 음료 브랜드들은 슈페티 냉장고 진열을 겨냥한 마케팅과 한정판 협업을 늘리며 이 문화에 올라타고 있다."]},
 en:{title:"Why the bench outside a Berlin Späti is the new hotspot",
  summary:"Skip the club, meet at the corner shop — Berlin's low-budget social ritual is having a moment.",

  summary:"커피와 시나몬번, 그리고 아무 일도 일어나지 않는 15분. 스웨덴식 휴식이 콘텐츠가 됐다.",
  body:["스웨덴의 커피 휴식 문화 '피카(fika)'를 그대로 담은 영상이 유럽 전역에서 조용히 조회수를 모으고 있다. 빠른 편집 없이 커피를 내리고 빵을 먹는 과정이 전부다.","자극적인 숏폼에 지친 이용자들이 '함께 쉬는 감각'을 주는 느린 콘텐츠에서 위안을 찾는다는 분석이 나온다.","카페 브랜드와 가구·리빙 브랜드들이 피카 무드를 차용한 광고를 늘리며, '멈춤'을 파는 마케팅이 새 흐름으로 자리잡고 있다."]},

  summary:"Coffee, a cinnamon bun, and fifteen minutes where nothing happens — the Swedish pause is now a format.",
  body:["Videos capturing Sweden's fika coffee-break ritual are quietly racking up views across Europe. No fast cuts — just brewing coffee and eating a bun.","Analysts point to fatigue with high-stimulation short-form: slow content offers viewers the feeling of resting together.","Café, furniture and homeware brands are borrowing the fika mood in campaigns, making 'selling the pause' a distinct marketing current."]}},

  body:["세제와 곡물을 용기에 담아 사는 리필 스테이션, 공병을 반납하면 보증금을 돌려주는 기계가 유럽 각국 마트에서 일상적인 풍경이 됐다.","젊은 소비자들에게 이런 절차는 번거로움이 아니라 당연한 매너로 받아들여지며, 리필·반납 인증은 SNS의 흔한 콘텐츠 소재가 됐다.","브랜드들은 리필 전용 패키지와 매장 내 회수 프로그램을 확대하며, 지속가능성을 비용이 아닌 고객 접점으로 다루기 시작했다."]},
 en:{title:"Refill stations and deposit returns: zero-waste goes mundane",
  summary:"Refill corners and bottle-return machines are no longer a novelty in European supermarkets.",
  body:["Refill stations for detergent and grains, and reverse-vending machines that pay back bottle deposits, have become ordinary sights in supermarkets across Europe.","For younger shoppers these routines read as basic manners rather than hassle — and posting a refill or return has become everyday social content.","Brands are expanding refill-ready packaging and in-store take-back schemes, treating sustainability as a customer touchpoint instead of a cost line."]}},

  body:["프랑스의 여름 정기 세일 '솔드(soldes)' 기간에도, 젊은 소비자 상당수는 매장 대신 중고 거래 앱부터 연다. 세일가보다 싼 중고가가 상시로 존재하기 때문이다.","'세일을 기다린다'는 소비 리듬 자체가 약해지면서, 기간 한정 할인의 심리적 효과가 예전 같지 않다는 평가가 나온다.","리테일러들은 매장 내 중고 코너 운영, 보상판매 프로그램 등 중고 시장을 적으로 두지 않는 전략으로 대응하고 있다."]},
 en:{title:"French shoppers open resale apps before the summer soldes",

  body:["Even during France's regulated summer soldes, many young consumers check resale apps before hitting the shops — secondhand prices undercut sale prices all year round.","With the rhythm of 'waiting for the sale' fading, the psychological pull of time-limited discounts isn't what it used to be.","Retailers are adapting by running in-store secondhand corners and trade-in programmes — treating resale as a channel, not a rival."]}},

 en:{title:"Sentences that start with 'Digga': how German rap rewired slang",
  summary:"Rap-scene vocabulary keeps gaining ground in how young German speakers talk.",
  body:["From greetings like 'Digga', expressions born in the German rap scene are now deeply embedded in everyday youth vocabulary.","Carried by streaming and short-form video, the language crosses regions and class lines — and dominates the shortlists of annual 'youth word of the year' votes.","Brand copy aimed at young audiences borrows these words carefully; used out of context they backfire fast, so calibration is everything."]}},

 ko:{title:"'소브레메사'를 아시나요? 남유럽 슬로 다이닝 콘텐츠",
  summary:"식사가 끝나도 자리를 뜨지 않는 시간. 스페인과 이탈리아의 식탁 문화가 동경의 대상이 됐다.",
  body:["식사 후 식탁에 남아 대화를 이어가는 스페인의 '소브레메사', 저녁 전 가볍게 한잔하는 이탈리아의 '아페리티보'가 유럽 전역의 라이프스타일 콘텐츠로 소비되고 있다.","바쁜 도시 생활과 대비되는 '시간을 낭비할 줄 아는 여유'가 로망으로 자리잡으며, 남유럽 식문화를 체험하는 여행 콘텐츠도 함께 늘었다.","음료·식품 브랜드들은 '천천히 즐기는 시간'을 제품 서사에 결합하며 이 정서를 마케팅 언어로 옮기고 있다."]},
 en:{title:"Do you know 'sobremesa'? Southern Europe's slow-dining moment",
  summary:"Lingering at the table after the meal — Spanish and Italian table culture has become aspirational content.",
  body:["Spain's sobremesa — staying at the table talking long after the food is gone — and Italy's pre-dinner aperitivo are being consumed as lifestyle content across Europe.","The 'luxury of wasting time', a counterpoint to hurried city life, has become a shared aspiration, boosting travel content built around southern food culture.","Drinks and food brands are folding 'time enjoyed slowly' into product storytelling, translating the mood into marketing language."]}},
{id:9,cat:'consumer',region:'uk',badge:'hot',date:'2026-06-29',emoji:'⚽',
 tags:{ko:['블로크코어','유니폼패션','레트로'],en:['blokecore','footballshirt','retro']},
 ko:{title:"축구 유니폼이 데일리룩으로: 블로크코어의 진화",
  summary:"경기장 밖에서 빈티지 유니폼을 입는 '블로크코어'가 영국을 넘어 유럽 패션 신을 물들이고 있다.",
  body:["빈티지 축구 유니폼에 청바지를 매치하는 '블로크코어(blokecore)' 스타일이 영국을 시작으로 유럽 전역의 스트리트 패션에 자리잡았다.","희소한 시즌의 유니폼일수록 가치가 올라가면서 리셀 시장도 함께 커졌고, 유니폼은 팀 응원 도구를 넘어 취향의 아카이브가 됐다.","스포츠 브랜드와 구단들은 레트로 디자인 재발매와 패션 브랜드 협업으로 이 수요에 대응하며, 유니폼을 시즌 상품이 아닌 패션 아이템으로 다루기 시작했다."]},
 en:{title:"Football shirts as daily wear: blokecore levels up",
  summary:"Wearing vintage kits far from the stadium, blokecore has spread from the UK across European fashion.",
  body:["Pairing vintage football shirts with jeans — blokecore — has settled into street fashion across Europe, starting from the UK.","Shirts from rare seasons keep appreciating, growing the resale market; a kit is now a taste archive, not just supporter gear.","Sports brands and clubs are answering with retro re-issues and fashion collabs, treating shirts as fashion items rather than seasonal merchandise."]}},
{id:10,cat:'lifestyle',region:'eu',badge:'hot',date:'2026-06-28',emoji:'🚆',
 tags:{ko:['인터레일','저예산여행','기차여행'],en:['interrail','budgettravel','railtrip']},
 ko:{title:"인터레일 패스 하나로 유럽 한 달: 저예산 여행 브이로그 붐",
  summary:"기차 패스 하나로 국경을 넘나드는 한 달 여행기가 유럽 여행 콘텐츠의 표준 포맷이 됐다.",
  body:["유럽 철도를 자유롭게 이용하는 인터레일 패스로 여러 나라를 도는 저예산 여행 브이로그가 여름마다 쏟아진다. 야간열차와 호스텔, 마트 장보기가 콘텐츠의 단골 장면이다.","비행기 대신 기차를 택하는 선택은 비용 절감과 함께 탄소 배출을 줄인다는 명분을 얹어 '가치 있는 절약'으로 소비된다.","철도 사업자와 여행 플랫폼들은 젊은 여행자 대상 할인 패스와 루트 추천 콘텐츠를 강화하며 이 흐름을 키우고 있다."]},
 en:{title:"A month across Europe on one Interrail pass: the budget-travel vlog boom",
  summary:"Border-hopping month-long rail trips have become the default format of European travel content.",
  body:["Every summer brings a wave of budget vlogs touring Europe on an Interrail pass. Night trains, hostels and supermarket runs are the format's signature scenes.","Choosing rail over flights doubles as thrift and as lower-carbon virtue — consumed together as 'saving that means something'.","Rail operators and travel platforms are feeding the wave with youth passes and route-planning content."]}},
{id:11,cat:'marketing',region:'eu',badge:'rising',date:'2026-06-27',emoji:'📬',
 tags:{ko:['쿠키리스','뉴스레터','GDPR'],en:['cookieless','newsletter','GDPR']},
 ko:{title:"쿠키리스 시대, 유럽 마케터들이 뉴스레터로 돌아가는 이유",
  summary:"추적 광고가 어려워질수록, 직접 받은 이메일 주소의 가치는 올라간다.",
  body:["GDPR을 비롯한 유럽의 개인정보 규제와 서드파티 쿠키 축소로 정밀 타겟팅 광고의 입지가 좁아지면서, 마케터들이 뉴스레터 같은 자체 채널로 눈을 돌리고 있다.","이용자가 스스로 동의하고 구독한 이메일은 규제 리스크가 적으면서도 높은 도달률을 보장하는 채널로 재평가받는 중이다.","개성 있는 큐레이션과 필자의 목소리를 앞세운 인디 뉴스레터들이 성장하면서, 브랜드들도 '광고 같지 않은 구독 콘텐츠' 실험을 늘리고 있다."]},
 en:{title:"Why European marketers are going back to newsletters in the cookieless era",
  summary:"As tracking gets harder, an email address given willingly is worth more than ever.",
  body:["With GDPR-era privacy rules and the decline of third-party cookies squeezing precision ad targeting, marketers are turning back to owned channels like newsletters.","An inbox subscription granted by explicit consent is being re-rated: low regulatory risk, reliably high reach.","As indie newsletters with strong curation and personal voice keep growing, brands are running more experiments in 'subscription content that doesn't feel like ads'."]}},
{id:12,cat:'sustain',region:'nordics',badge:null,date:'2026-06-26',emoji:'🕯️',
 tags:{ko:['라곰','미니멀소비','오래쓰기'],en:['lagom','minimalism','buyless']},
 ko:{title:"북유럽의 '라곰' 소비: 덜 사고 오래 쓰는 게 힙하다",
  summary:"'딱 적당히'를 뜻하는 스웨덴어 라곰이 소비 태도의 기준으로 확산되고 있다.",
  body:["과하지도 부족하지도 않은 상태를 뜻하는 스웨덴어 '라곰(lagom)'이 북유럽을 넘어 유럽 젊은 층의 소비 태도를 설명하는 말로 쓰이고 있다.","새 물건 자랑보다 오래 쓴 물건의 수선 기록, 물려받은 가구의 역사를 공유하는 콘텐츠가 호응을 얻는다.","가구·의류 브랜드들은 평생 수리 보증, 중고 보상 프로그램을 전면에 내세우며 '적게 파는 것처럼 보이는' 마케팅으로 신뢰를 쌓고 있다."]},
 en:{title:"Nordic 'lagom' spending: buying less, keeping longer is the flex",
  summary:"The Swedish word for 'just enough' is spreading as a consumption standard.",
  body:["Lagom — Swedish for not too much, not too little — has travelled beyond the Nordics to describe how young Europeans want to consume.","Instead of new-purchase flexes, repair logs of long-kept items and the histories of inherited furniture are the content that lands.","Furniture and apparel brands lead with lifetime repair guarantees and trade-in schemes, building trust through marketing that looks like selling less."]}},
{id:13,cat:'retail',region:'south',badge:'hot',date:'2026-06-25',emoji:'🛒',
 tags:{ko:['슈퍼마켓','PB간식','여행쇼핑'],en:['supermarket','ownbrand','snackhaul']},
 ko:{title:"남유럽 여행의 마지막 코스는 슈퍼마켓 간식 하울",
  summary:"스페인·이탈리아 슈퍼마켓의 자체 브랜드 간식이 기념품 시장을 흔들고 있다.",
  body:["남유럽 여행자들 사이에서 마지막 일정으로 슈퍼마켓에 들러 자체 브랜드(PB) 간식을 쓸어 담는 '슈퍼마켓 하울'이 정착했다. 초콜릿, 올리브오일 과자, 인스턴트 커피가 단골 품목이다.","관광지 기념품보다 싸고 현지인의 일상을 담았다는 점에서 '진짜 로컬'을 원하는 여행 정서와 맞아떨어진다. 귀국 후 간식 리뷰 영상은 후속 콘텐츠로 이어진다.","현지 마트 체인들은 여행자 동선에 맞춰 소포장 상품과 시즌 한정판을 늘리며 이 수요를 정식 고객층으로 끌어들이고 있다."]},
 en:{title:"The last stop of a Southern Europe trip: the supermarket snack haul",
  summary:"Own-brand snacks from Spanish and Italian supermarkets are shaking up the souvenir market.",
  body:["Travellers in Southern Europe now end their trips at the supermarket, loading up on own-brand snacks — chocolate, olive-oil crackers and instant coffee are the staples of the 'supermarket haul'.","Cheaper than tourist souvenirs and closer to local daily life, the ritual fits the appetite for 'the real local' — and the unboxing review back home makes a natural follow-up video.","Local chains are answering with travel-size packs and seasonal editions placed along tourist routes, converting the wave into a proper customer segment."]}},
{id:14,cat:'retail',region:'de',badge:null,date:'2026-06-24',emoji:'💄',
 tags:{ko:['드러그스토어','듀프','저가뷰티'],en:['drugstore','dupe','budgetbeauty']},
 ko:{title:"독일 드러그스토어가 유럽 뷰티 성지가 된 이유",
  summary:"몇 유로짜리 자체 브랜드 화장품이 고가 제품의 '듀프'로 불리며 원정 쇼핑을 부른다.",
  body:["독일 드러그스토어 체인의 자체 브랜드 화장품이 고가 브랜드 못지않다는 입소문을 타면서, 주변국에서 원정 쇼핑을 오는 사례까지 생기고 있다.","비싼 제품의 저렴한 대체재를 찾는 '듀프(dupe)' 문화가 확산하며, 성분 비교와 발색 테스트 영상이 구매 결정의 표준 절차가 됐다.","드러그스토어들은 SNS에서 화제가 된 품목을 빠르게 매대 전면에 배치하고 재고를 늘리는 방식으로 화제성을 매출로 연결하고 있다."]},
 en:{title:"How German drugstores became Europe's beauty pilgrimage",
  summary:"Own-brand cosmetics costing a few euros are hailed as dupes for high-end products — and worth a border run.",
  body:["Own-brand cosmetics from German drugstore chains have earned a reputation for matching premium brands, drawing shoppers from neighbouring countries on dedicated trips.","Dupe culture — hunting cheap equivalents of expensive products — keeps growing, with ingredient comparisons and swatch tests now a standard step before buying.","The chains convert buzz into sales by rushing viral items to front-of-store placement and deepening stock the moment something trends."]}},
{id:15,cat:'marketing',region:'uk',badge:'rising',date:'2026-06-23',emoji:'🍺',
 tags:{ko:['펍','챌린지','참여형마케팅'],en:['pub','challenge','participation']},
 ko:{title:"펍에서 태어난 챌린지: 맥주 한 잔이 콘텐츠가 되는 법",
  summary:"잔의 로고에 맞춰 첫 모금을 멈추는 놀이가 보여준 참여형 마케팅의 힘.",
  body:["영국 펍에서는 흑맥주 첫 모금을 잔에 새겨진 로고 중앙에 정확히 맞춰 멈추는 놀이가 유행했다. 성공 여부를 친구들이 판정하고 촬영하는 과정 자체가 콘텐츠가 된다.","브랜드가 시킨 적 없는 놀이가 소비자 사이에서 자생적으로 퍼졌다는 점이 핵심이다. 제품을 마시는 '방법'이 게임이 되면 광고 없이도 참여가 반복된다.","이후 여러 주류 브랜드가 잔과 패키지에 참여 요소를 심는 실험을 이어가며, 오프라인 소비 순간을 콘텐츠로 바꾸는 설계가 마케팅 과제로 떠올랐다."]},
 en:{title:"Born in the pub: how one sip became a content format",
  summary:"Stopping your first gulp exactly at the glass's logo — a lesson in participatory marketing.",
  body:["In British pubs, a game took off around stopping the first sip of a stout precisely at the centre of the logo printed on the glass. Friends judge the attempt on camera — the verdict is the content.","Crucially, no brand asked for it: the game spread on its own. When the way you drink a product becomes a game, participation repeats without ad spend.","Drinks brands have since experimented with building playable moments into glasses and packaging, making 'turning an offline sip into content' a live design brief."]}},
{id:16,cat:'consumer',region:'fr',badge:'hot',date:'2026-06-22',emoji:'🥐',
 tags:{ko:['크루키','하이브리드디저트','베이커리'],en:['crookie','hybridpastry','bakery']},
 ko:{title:"크루아상+쿠키 '크루키', 파리 베이커리 대란",
  summary:"두 디저트를 합친 하이브리드 페이스트리가 오픈런을 부르는 공식이 됐다.",
  body:["크루아상 속에 쿠키 반죽을 채워 구운 '크루키'가 파리 베이커리에 오픈런을 일으켰다. 원조 가게 앞 줄서기 인증은 그 자체로 콘텐츠가 됐다.","크로넛 이후 이어져 온 하이브리드 디저트 공식 — 익숙한 두 가지의 의외의 결합 — 이 여전히 유효하다는 것을 보여준 사례다.","전 세계 베이커리가 각자의 크루키를 내놓으며 레시피가 로컬화되는 속도도 빨라졌다. 원조 논쟁과 비교 리뷰가 화제성을 계속 공급한다."]},
 en:{title:"Croissant + cookie: the 'crookie' storms Paris bakeries",
  summary:"The hybrid pastry has become a formula for queues around the block.",
  body:["The crookie — a croissant baked with cookie dough inside — set off morning queues at Paris bakeries, with queue selfies outside the original shop becoming content in themselves.","It proves the hybrid-dessert formula that started with the cronut still works: an unexpected marriage of two familiar things.","Bakeries worldwide now sell their own crookies, and localisation keeps accelerating — origin debates and comparison reviews keep feeding the buzz."]}},
{id:17,cat:'marketing',region:'eu',badge:'hot',date:'2026-06-21',emoji:'🪧',
 tags:{ko:['옥외광고','OOH','밈광고'],en:['OOH','billboard','memead']},
 ko:{title:"디지털 피로 시대, 옥외광고가 다시 힙해졌다",
  summary:"스킵할 수 없는 매체의 역설적 매력. 유럽 도심 빌보드가 밈의 발원지가 되고 있다.",
  body:["온라인 광고 피로가 쌓일수록, 거리에서 마주치는 대형 옥외광고(OOH)의 존재감이 커지고 있다. 잘 만든 빌보드는 행인들의 캡처를 통해 온라인으로 역수입된다.","유럽 주요 도시에서는 주변 환경이나 시사 이슈에 재치 있게 반응하는 '맥락형' 옥외광고가 화제를 만드는 공식으로 자리잡았다.","브랜드들은 옥외광고를 도달 매체가 아니라 '촬영되기 위한 무대'로 설계하기 시작했다. 오프라인에 걸고 온라인에서 퍼지는 이중 구조가 표준이 되는 중이다."]},
 en:{title:"In the age of digital fatigue, billboards got cool again",
  summary:"The paradoxical pull of an unskippable medium — European city billboards are becoming meme sources.",
  body:["As online ad fatigue piles up, large-format out-of-home advertising is regaining presence. A well-made billboard gets photographed by passers-by and re-imported to the internet.","Across major European cities, 'contextual' OOH that wittily reacts to its surroundings or current events has become a reliable buzz formula.","Brands now design billboards as stages to be photographed, not just reach media — posted offline, spread online, as the new default structure."]}},
{id:18,cat:'consumer',region:'nordics',badge:'rising',date:'2026-06-20',emoji:'🏔️',
 tags:{ko:['고프코어','아웃도어','기능성패션'],en:['gorpcore','outdoor','technicalwear']},
 ko:{title:"고프코어: 등산복이 북유럽 시티룩이 되기까지",
  summary:"기능성 아웃도어를 도심에서 입는 스타일이 북유럽 감성과 만나 유럽 전역으로 퍼졌다.",
  body:["방수 재킷과 트레킹화를 도심 일상복으로 입는 '고프코어(gorpcore)'가 북유럽 도시들을 중심으로 유럽 스트리트 패션에 자리잡았다.","자연과 가까운 북유럽 라이프스타일과 실용주의가 스타일의 설득력을 뒷받침한다. 날씨가 나쁠수록 옷장이 강해진다는 농담이 따라붙는다.","아웃도어 브랜드들은 기술력을 강조하던 마케팅에서 도시적 스타일링 제안으로 무게를 옮기며, 패션 하우스와의 협업도 활발해졌다."]},
 en:{title:"Gorpcore: how hiking gear became the Nordic city look",
  summary:"Technical outdoor wear worn downtown met Nordic sensibility and spread across Europe.",
  body:["Wearing waterproof shells and trekking shoes as daily city wear — gorpcore — has settled into European street fashion, led by Nordic cities.","Nordic closeness to nature and plain practicality give the style its credibility; the joke goes that the worse the weather, the stronger the wardrobe.","Outdoor brands are shifting marketing weight from spec sheets to urban styling, and collaborations with fashion houses keep multiplying."]}},
{id:19,cat:'content',region:'south',badge:'rising',date:'2026-06-19',emoji:'👵',
 tags:{ko:['논나','요리채널','세대콘텐츠'],en:['nonna','cookingchannel','generational']},
 ko:{title:"이탈리아 할머니의 파스타 채널이 사랑받는 이유",
  summary:"계량 없는 손맛과 무뚝뚝한 애정. '논나 콘텐츠'는 세대를 연결하는 포맷이 됐다.",
  body:["이탈리아 할머니(논나)들이 손자 세대의 도움으로 파스타 만드는 과정을 올리는 채널들이 유럽 전역에서 꾸준한 팬덤을 모으고 있다.","정확한 계량 대신 '느낌만큼', 화려한 편집 대신 부엌의 소음. 완벽하게 다듬어진 콘텐츠에 지친 시청자들이 이 투박함을 진정성으로 읽는다.","식품 브랜드들은 전통 레시피 아카이빙 캠페인이나 조부모-손주 협업 콘텐츠 형식을 빌려, 세대를 잇는 서사를 마케팅에 접목하고 있다."]},
 en:{title:"Why an Italian grandmother's pasta channel wins hearts",
  summary:"No measuring cups, gruff affection — 'nonna content' has become a format that bridges generations.",
  body:["Channels where Italian grandmothers make pasta on camera — with grandchildren handling the filming — keep gathering loyal audiences across Europe.","'By feel' instead of grams, kitchen clatter instead of polished edits: viewers tired of manicured content read the roughness as authenticity.","Food brands are borrowing the format through recipe-archiving campaigns and grandparent-grandchild collabs, folding the generational thread into marketing."]}},
{id:20,cat:'sustain',region:'de',badge:null,date:'2026-06-18',emoji:'🪑',
 tags:{ko:['길거리나눔','중고가구','무료나눔'],en:['streetgiveaway','usedfurniture','zuverschenken']},
 ko:{title:"'가져가세요': 베를린 길거리 나눔 문화",
  summary:"이사철 보도블록 위 '공짜' 박스는 베를린의 오래된 순환 경제 인프라다.",
  body:["베를린에서는 쓸 만한 물건을 'Zu verschenken(가져가세요)' 쪽지와 함께 집 앞에 내놓는 문화가 일상이다. 이사철 보도는 작은 무료 벼룩시장이 된다.","길에서 발견한 가구를 고쳐 쓰는 과정을 기록한 콘텐츠가 인기를 얻으며, '주운 가구 리폼'은 하나의 콘텐츠 장르로 굳어졌다.","가구·DIY 브랜드들은 수선 워크숍과 부자재 키트로 이 문화에 접속한다. 새 물건을 파는 대신 고쳐 쓰는 과정에 브랜드를 심는 접근이다."]},
 en:{title:"'Zu verschenken': Berlin's street giveaway culture",
  summary:"The 'free stuff' box on the pavement is Berlin's long-running circular-economy infrastructure.",
  body:["In Berlin, leaving usable things outside with a 'Zu verschenken' (free to take) note is everyday practice — during moving season, pavements become small free flea markets.","Videos documenting the rescue and repair of street-found furniture keep gaining traction, hardening 'kerbside furniture flips' into a content genre of its own.","Furniture and DIY brands plug in via repair workshops and hardware kits — planting the brand in the act of fixing rather than the act of buying new."]}},
{id:21,cat:'lifestyle',region:'uk',badge:'hot',date:'2026-06-17',emoji:'🏃',
 tags:{ko:['러닝클럽','소셜','오프라인모임'],en:['runclub','social','IRLmeetup']},
 ko:{title:"런던 러닝 클럽, 데이팅 앱의 대항마가 되다",
  summary:"토요일 아침 공원에 모이는 이유가 기록만은 아니다. 러닝 클럽이 새로운 사교장이 됐다.",
  body:["런던 곳곳의 러닝 클럽 참가자가 눈에 띄게 늘었다. 달리기 후 커피로 이어지는 루틴이 표준이 되면서, 러닝 클럽은 운동 모임이자 사교 모임으로 자리잡았다.","화면 속 스와이프에 지친 젊은 층이 '자연스럽게 만나는 오프라인'을 찾는 흐름과 맞물려, 러닝 클럽에서 친구와 연인을 만났다는 후기가 이어진다.","스포츠 브랜드와 카페들은 클럽 후원과 굿즈, 러닝 후 할인으로 이 커뮤니티에 접속하며, '함께 달리는 경험'을 브랜드 접점으로 만들고 있다."]},
 en:{title:"London run clubs take on the dating apps",
  summary:"Saturday mornings in the park aren't only about pace — run clubs have become the new social scene.",
  body:["Run club turnout across London has visibly grown. With the post-run coffee now standard, clubs double as sports meetups and social scenes.","Young people weary of swiping want offline encounters that happen naturally — and stories of friendships and relationships that started at a run club keep coming.","Sports brands and cafés plug in through sponsorships, merch and post-run discounts, turning the shared run into a brand touchpoint."]}},
{id:22,cat:'retail',region:'eu',badge:'hot',date:'2026-06-16',emoji:'👟',
 tags:{ko:['굿즈','리셀','디스카운터'],en:['merch','resale','discounter']},
 ko:{title:"디스카운트 마트 굿즈가 리셀 시장에 등장했다",
  summary:"초저가 마트 로고가 박힌 스니커즈와 양말이 완판되고 웃돈이 붙는 이유.",
  body:["유럽 초저가 마트 체인들이 자사 로고를 크게 새긴 스니커즈와 의류를 내놓을 때마다 완판 행렬이 이어지고, 일부는 리셀 시장에서 웃돈에 거래된다.","명품의 문법을 초저가 브랜드가 흉내 내는 아이러니 자체가 밈이 되면서, '진지하지 않은 플렉스'로 소비된다. 싼 것을 당당하게 입는 태도가 힙함의 코드가 됐다.","마트들은 한정 드롭 주기를 정례화하며 패션 브랜드의 드롭 전략을 그대로 가져왔다. 저가 이미지가 오히려 화제성의 원료가 되는 역전이 일어나고 있다."]},
 en:{title:"Discount-supermarket merch hits the resale market",
  summary:"Why trainers and socks stamped with a budget-chain logo sell out and trade above retail.",
  body:["Whenever Europe's discount chains drop trainers and apparel plastered with their own logos, sell-outs follow — and some pieces trade above retail on resale platforms.","The irony of a budget brand borrowing luxury's grammar is the meme: an unserious flex. Wearing cheap proudly has become its own code of cool.","The chains have adopted fashion's drop playbook with regular limited releases — a reversal where the budget image itself fuels the buzz."]}},
{id:23,cat:'marketing',region:'fr',badge:null,date:'2026-06-15',emoji:'💊',
 tags:{ko:['프렌치파머시','약국화장품','뷰티관광'],en:['frenchpharmacy','skincare','beautytourism']},
 ko:{title:"프랑스 약국은 어떻게 글로벌 뷰티 성지가 됐나",
  summary:"처방전 없이 들르는 파리 약국이 관광 코스가 된 배경에는 '전문가의 보증'이 있다.",
  body:["파리의 약국은 이제 여행 일정에 오르는 쇼핑 코스다. 약사가 추천하는 스킨케어라는 신뢰의 서사가 '프렌치 파머시' 브랜드들의 핵심 자산이 됐다.","화려한 패키지 대신 임상과 성분을 앞세운 절제된 톤이 오히려 전문성의 신호로 읽히며, 뷰티 인플루언서들의 '약국 하울' 콘텐츠가 수요를 계속 키운다.","브랜드들은 약국이라는 채널 자체의 신뢰를 마케팅 자산으로 삼는다. 어디서 파는가가 무엇을 파는가만큼 중요해진 사례다."]},
 en:{title:"How the French pharmacy became a global beauty destination",
  summary:"Paris pharmacies made it onto travel itineraries — on the strength of 'expert endorsement'.",
  body:["The Paris pharmacy is now a scheduled shopping stop. Skincare recommended by a pharmacist — that narrative of trust is the core asset of 'French pharmacy' brands.","Restrained packaging that leads with clinicals and ingredients reads as a signal of expertise, while influencer 'pharmacy haul' content keeps compounding demand.","The brands treat the channel's credibility itself as marketing capital — a case where where you sell matters as much as what you sell."]}},
{id:24,cat:'content',region:'eu',badge:'hot',date:'2026-06-14',emoji:'🎤',
 tags:{ko:['유로비전','밈','시즌이벤트'],en:['Eurovision','meme','seasonalevent']},
 ko:{title:"유로비전은 어떻게 유럽 최대 밈 축제가 됐나",
  summary:"경연보다 리액션. 유로비전 시즌의 진짜 무대는 SNS 타임라인이다.",
  body:["유로비전 송 콘테스트 시즌이 되면 유럽의 SNS는 무대 캡처와 리액션 밈으로 뒤덮인다. 본방송만큼이나 실시간 밈 생산이 이 행사의 핵심 관전 포인트가 됐다.","국가별 자존심 대결, 이해할 수 없는 무대 연출, 진지함과 키치의 공존이 밈의 원료다. 시청자들은 응원보다 드립으로 참여한다.","브랜드들도 시즌에 맞춰 실시간 반응형 콘텐츠를 준비한다. 유럽 전역이 같은 시간에 같은 화면을 보는 드문 순간은 마케팅 캘린더의 대목으로 굳어졌다."]},
 en:{title:"How Eurovision became Europe's biggest meme festival",
  summary:"Reactions over rankings — the real Eurovision stage is the social feed.",
  body:["Come Eurovision season, European social feeds drown in stage screenshots and reaction memes. Real-time meme production is now as central to the event as the broadcast itself.","National pride battles, inexplicable staging, sincerity coexisting with kitsch — that's the raw material. Viewers participate through jokes more than votes.","Brands prepare real-time reactive content for the season: the rare moment when the whole continent watches the same screen has hardened into a fixture of the marketing calendar."]}}
];

const DICTIONARY = [
{id:1,term:"Peng",tag:'uk',ko:{meaning:"아주 멋지거나 매력적이라는 뜻의 영국 슬랭.",origin:"런던 다문화 구어(MLE)에서 확산된 표현.",example:"That jacket is peng. (그 재킷 진짜 예쁘다.)"},en:{meaning:"UK slang for very attractive or excellent.",origin:"Spread through Multicultural London English (MLE).",example:"That jacket is peng."}},
{id:2,term:"Innit",tag:'uk',ko:{meaning:"'isn't it'의 줄임말로, 문장 끝에 붙여 동의를 구하는 영국식 말버릇.",origin:"런던 구어에서 시작해 영국 전역의 일상어로 정착.",example:"Proper cold today, innit. (오늘 진짜 춥지 않냐.)"},en:{meaning:"Contraction of 'isn't it', tagged onto sentences to seek agreement.",origin:"From London vernacular, now everyday speech across the UK.",example:"Proper cold today, innit."}},
{id:3,term:"MDR",tag:'fr',ko:{meaning:"'mort de rire(웃겨 죽음)'의 줄임말. 프랑스판 ㅋㅋㅋ.",origin:"프랑스 채팅 문화에서 LOL 대신 쓰이며 정착.",example:"MDR t'es sérieux ? (ㅋㅋㅋ 진심이야?)"},en:{meaning:"Short for 'mort de rire' (dying of laughter) — the French LOL.",origin:"Fixed in French chat culture as the local alternative to LOL.",example:"MDR t'es sérieux ?"}},
{id:4,term:"Verlan",tag:'fr',ko:{meaning:"단어의 음절을 뒤집어 만드는 프랑스식 은어 조어법. meuf(여자), ouf(미친) 등이 대표적.",origin:"파리 교외 젊은 층의 언어 놀이에서 시작해 표준 구어로 흡수.",example:"C'est ouf ! (미쳤다! ← fou를 뒤집은 말)"},en:{meaning:"French slang built by flipping a word's syllables — e.g. meuf (femme), ouf (fou).",origin:"Born as wordplay in Parisian suburbs, absorbed into everyday speech.",example:"C'est ouf ! (from 'fou', crazy)"}},
{id:5,term:"Digga",tag:'de',ko:{meaning:"'야', '친구야'에 해당하는 독일 젊은 층의 호칭.",origin:"함부르크 힙합 신에서 시작해 독일 전역으로 확산.",example:"Digga, was geht? (야, 뭐 해?)"},en:{meaning:"German youth address meaning 'dude' or 'mate'.",origin:"From the Hamburg hip-hop scene, now nationwide.",example:"Digga, was geht?"}},
{id:6,term:"Späti",tag:'de',ko:{meaning:"베를린의 심야 편의점. 그 앞 벤치는 저예산 사교의 성지.",origin:"'spät(늦은)'에서 온 말로, 늦게까지 여는 가게라는 뜻.",example:"Treffen wir uns am Späti. (슈페티 앞에서 보자.)"},en:{meaning:"Berlin's late-night corner shop; the bench outside is a budget social hub.",origin:"From 'spät' (late) — a shop that stays open late.",example:"Treffen wir uns am Späti."}},
{id:7,term:"Fika",tag:'nordics',ko:{meaning:"커피와 달콤한 빵을 곁들인 스웨덴식 휴식 시간. 단순한 커피브레이크 이상의 문화.",origin:"스웨덴어 kaffe(커피)의 음절을 뒤집은 말이라는 설이 유력.",example:"Ska vi fika? (피카 할래?)"},en:{meaning:"The Swedish coffee-and-pastry break — a ritual, not just a coffee.",origin:"Likely from flipping the syllables of 'kaffe' (coffee).",example:"Ska vi fika?"}},
{id:8,term:"Hygge",tag:'nordics',ko:{meaning:"아늑하고 편안한 분위기를 뜻하는 덴마크어. 초와 담요, 좋은 사람들이 있는 저녁.",origin:"덴마크 라이프스타일을 대표하는 개념으로 세계에 수출됐다.",example:"Candles on, phone off — pure hygge."},en:{meaning:"Danish for a cosy, contented atmosphere — candles, blankets, good company.",origin:"Exported worldwide as the signature Danish lifestyle concept.",example:"Candles on, phone off — pure hygge."}},
{id:9,term:"Lagom",tag:'nordics',ko:{meaning:"'과하지도 부족하지도 않게, 딱 적당히'를 뜻하는 스웨덴어. 절제된 소비 태도의 상징.",origin:"스웨덴의 생활 철학에서 소비 트렌드 용어로 확장.",example:"Lagom is the new flex. (적당함이 새로운 자랑.)"},en:{meaning:"Swedish for 'not too much, not too little — just right'; shorthand for restrained consumption.",origin:"Expanded from Swedish life philosophy into a consumer-trend term.",example:"Lagom is the new flex."}},
{id:10,term:"Sobremesa",tag:'south',ko:{meaning:"식사가 끝난 뒤 식탁에 남아 대화를 이어가는 시간을 뜻하는 스페인어.",origin:"'식탁 위에(sobre mesa)'라는 뜻에서 온 스페인 식문화 용어.",example:"점심 후 소브레메사가 두 시간을 넘겼다."},en:{meaning:"Spanish for the time spent lingering in conversation at the table after a meal.",origin:"Literally 'over the table' — a fixture of Spanish dining culture.",example:"Lunch ended at two; sobremesa lasted till four."}},
{id:11,term:"Dolce far niente",tag:'south',ko:{meaning:"'아무것도 하지 않는 달콤함'이라는 이탈리아어. 게으름을 즐기는 태도.",origin:"이탈리아의 여유 문화를 상징하는 관용구.",example:"오후 내내 돌체 파 니엔테 모드."},en:{meaning:"Italian for 'the sweetness of doing nothing' — leisure enjoyed without guilt.",origin:"A stock phrase symbolising Italian ease.",example:"Whole afternoon in dolce far niente mode."}},
{id:12,term:"Blokecore",tag:'uk',ko:{meaning:"빈티지 축구 유니폼에 청바지를 매치하는 스트리트 패션 스타일.",origin:"'평범한 아저씨(bloke)'의 옷차림을 힙하게 재해석한 데서 유래.",example:"주말 룩은 블로크코어로 통일."},en:{meaning:"Street style pairing vintage football shirts with jeans.",origin:"A hip reinterpretation of the average 'bloke' outfit.",example:"Weekend fit: full blokecore."}},
{id:13,term:"Cheeky",tag:'uk',ko:{meaning:"짓궂지만 밉지 않은, 가벼운 일탈을 꾸며주는 영국식 형용사. 계획에 없던 소소한 즐거움에 붙인다.",origin:"'뻔뻔한'이라는 원뜻이 애교 섞인 뉘앙스로 순화되며 굳어졌다.",example:"Fancy a cheeky pint after work? (퇴근하고 가볍게 한잔 어때?)"},en:{meaning:"British adjective for a small, mischievous-but-harmless indulgence — an unplanned little treat.",origin:"The original sense of 'impudent' softened into playful affection.",example:"Fancy a cheeky pint after work?"}},
{id:14,term:"Banter",tag:'uk',ko:{meaning:"친구 사이에 서로 놀리며 주고받는 장난 섞인 대화. 영국식 우정의 기본 언어.",origin:"17세기부터 쓰인 말로, 영국 펍 문화와 함께 일상어로 정착.",example:"It's just banter, mate. (그냥 장난이야, 친구.)"},en:{meaning:"Playful teasing exchanged between friends — the default language of British friendship.",origin:"In use since the 17th century, cemented as everyday speech alongside pub culture.",example:"It's just banter, mate."}},
{id:15,term:"Flâner",tag:'fr',ko:{meaning:"목적지 없이 도시를 어슬렁거리며 걷는 것. 파리식 산책의 정수.",origin:"19세기 파리의 산책자 '플라뇌르(flâneur)'에서 온 동사.",example:"Cet après-midi, on flâne. (오늘 오후엔 그냥 걷자.)"},en:{meaning:"To wander a city with no destination — the essence of the Parisian stroll.",origin:"From the 19th-century Parisian 'flâneur', the idle urban wanderer.",example:"Cet après-midi, on flâne."}},
{id:16,term:"Bof",tag:'fr',ko:{meaning:"'글쎄, 별로'를 뜻하는 프랑스식 심드렁한 감탄사. 어깨 으쓱과 세트.",origin:"무관심을 표현하는 의성어에서 굳어진 구어.",example:"Le film ? Bof. (영화? 뭐 그냥 그랬어.)"},en:{meaning:"The French interjection for unimpressed indifference — 'meh', shrug included.",origin:"An onomatopoeia of indifference hardened into everyday speech.",example:"Le film ? Bof."}},

/* ============ STATE ============ */
const STORE_KEY = 'catchup_global_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return Object.assign({bookmarks:[],savedTerms:[],history:[],subscribed:false,email:'',lang:'ko',consent:false}, JSON.parse(raw));
  }catch(e){}
  return {bookmarks:[],savedTerms:[],history:[],subscribed:false,email:'',lang:'ko',consent:false};
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
let state = loadState();
const L = ()=>STRINGS[state.lang];

let currentCat = 'all';
let currentRegion = 'all';
let currentArticleId = null;
let navStack = [];
let calYear, calMonth, calSelDate = null;
{
  const now = new Date();
  calYear = now.getFullYear(); calMonth = now.getMonth();
}

/* ============ I18N APPLY ============ */
function applyLang(){
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = L()[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML = L()[el.dataset.i18nHtml]; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = L()[el.dataset.i18nPh]; });
  document.getElementById('lang-btn').textContent = state.lang==='ko' ? 'EN' : 'KO';
}
function toggleLang(){
  state.lang = state.lang==='ko' ? 'en' : 'ko';
  saveState();
  applyLang();
  const active = activeViewName();
  if(active==='article' && currentArticleId!=null){ showArticle(currentArticleId, true); }
  else if(active==='search'){ const q=document.getElementById('search-inp2').value.trim(); if(q) runSearch(q); }
  else go(active);
}

/* ============ NAV ============ */
function activeViewName(){
  const v = document.querySelector('.view.active');
  return v ? v.id.replace('view-','') : 'home';
}
function showView(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  document.querySelectorAll('.bn-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
}
function go(view){
  navStack = [];
  showView(view);
  if(view==='home') renderHome();
  if(view==='dictionary') renderDictionary();
  if(view==='calendar') renderCalendar();
  if(view==='my') renderMy();
  if(view==='board') renderBoard();
}
function goBack(){
  const prev = navStack.pop();
  if(!prev){ go('home'); return; }
  if(prev.view==='article'){ showArticle(prev.articleId, true); }
  else {
    showView(prev.view);
    if(prev.view==='home') renderHome();
    if(prev.view==='board') renderBoard();
    if(prev.view==='my') renderMy();
    if(prev.view==='dictionary') renderDictionary();
  }
}

/* ============ TOAST ============ */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ============ TICKER + BOARD ============ */
let tickerIdx = 0, tickerTimer;
function renderTicker(){
  const track = document.getElementById('ticker-track');
  track.innerHTML = MICRO_TRENDS.map((m,i)=>
    `<div class="ticker-item${i===0?' show':''}">${m[state.lang]}<span class="ticker-time"> · ${m.time[state.lang]}</span></div>`
  ).join('');
  tickerIdx = 0;
  clearInterval(tickerTimer);
  tickerTimer = setInterval(()=>{
    const items = track.querySelectorAll('.ticker-item');
    if(!items.length) return;
    items[tickerIdx].classList.remove('show');
    tickerIdx = (tickerIdx+1) % items.length;
    items[tickerIdx].classList.add('show');
  }, 3200);
}
function renderBoard(){
  const el = document.getElementById('board-list');
  el.innerHTML = MICRO_TRENDS.map((m,i)=>
    `<div class="board-card" onclick="searchFromBoard(${i})">
      <div class="board-rank">${i+1}</div>
      <div class="board-body"><div class="board-text">${m[state.lang]}</div><div class="board-time">${m.time[state.lang]} ${L().detected}</div></div>
      <div class="board-arrow">🔍</div>
    </div>`
  ).join('');
}
function searchFromBoard(i){
  const q = MICRO_TRENDS[i].q[state.lang];
  showView('search');
  document.getElementById('search-inp2').value = q;
  runSearch(q);
}

/* ============ HOME ============ */
function selectCat(c){ currentCat = c; renderHome(); }
function selectRegion(r){ currentRegion = r; renderHome(); }
function badgeHtml(badge){
  if(badge==='hot') return `<span class="badge badge-hot">${L().badgeHot}</span>`;
  if(badge==='rising') return `<span class="badge badge-rising">${L().badgeRising}</span>`;
  return '';
}
function artCardHtml(a){
  const t = a[state.lang];
  const r = regionById(a.region);
  return `<div class="art-card" onclick="openArticle(${a.id})">
    <div class="art-thumb">${a.emoji}</div>
    <div class="art-body">
      <div class="art-badges">${badgeHtml(a.badge)}<span class="badge badge-region">${r.flag} ${r[state.lang]}</span><span class="badge badge-cat">${catById(a.cat)[state.lang]}</span></div>
      <div class="art-title">${t.title}</div>
      <div class="art-summary">${t.summary}</div>
      <div class="art-meta">${a.date}</div>
    </div>
  </div>`;
}
function renderHome(){
  renderTicker();
  const catsEl = document.getElementById('cat-scroll');
  catsEl.innerHTML = [`<button class="cat-chip${currentCat==='all'?' sel':''}" onclick="selectCat('all')">${L().allChip}</button>`]
    .concat(CATEGORIES.map(c=>`<button class="cat-chip${c.id===currentCat?' sel':''}" onclick="selectCat('${c.id}')">${c[state.lang]}</button>`)).join('');
  const regEl = document.getElementById('region-scroll');
  regEl.innerHTML = [`<button class="cat-chip${currentRegion==='all'?' sel':''}" onclick="selectRegion('all')">🌍 ${L().allChip}</button>`]
    .concat(REGIONS.map(r=>`<button class="cat-chip${r.id===currentRegion?' sel':''}" onclick="selectRegion('${r.id}')">${r.flag} ${r[state.lang]}</button>`)).join('');
  let list = ARTICLES;
  if(currentCat!=='all') list = list.filter(a=>a.cat===currentCat);
  if(currentRegion!=='all') list = list.filter(a=>a.region===currentRegion);
  const sorted = [...list].sort((a,b)=> b.date.localeCompare(a.date));
  document.getElementById('home-list').innerHTML = sorted.length ? sorted.map(artCardHtml).join('') : `<div class="empty-state">${L().emptyCat}</div>`;
}

/* ============ SEARCH ============ */
function doSearch(){
  const inSearchView = activeViewName()==='search';
  const q = (inSearchView
    ? document.getElementById('search-inp2').value
    : document.getElementById('search-inp').value).trim();
  if(!q){ toast(L().toastSearchEmpty); return; }
  if(!inSearchView) showView('search');
  navStack = [];
  document.getElementById('search-inp2').value = q;
  runSearch(q);
}
function runSearch(q){
  const query = q.toLowerCase();
  const lang = state.lang;
  const artResults = ARTICLES.filter(a =>
    a[lang].title.toLowerCase().includes(query) ||
    a[lang].summary.toLowerCase().includes(query) ||
    a.tags[lang].some(t=>t.toLowerCase().includes(query)) ||
    catById(a.cat)[lang].toLowerCase().includes(query) ||
    regionById(a.region)[lang].toLowerCase().includes(query)
  );
  const dictResults = DICTIONARY.filter(d =>
    d.term.toLowerCase().includes(query) || d[lang].meaning.toLowerCase().includes(query)
  );
  document.getElementById('search-summary').textContent = L().searchSummary(q, artResults.length);
  document.getElementById('search-art-list').innerHTML = artResults.length ? artResults.map(artCardHtml).join('') : `<div class="empty-state">${L().emptySearch}</div>`;
  const dictLabel = document.getElementById('search-dict-label');
  const dictList = document.getElementById('search-dict-list');
  if(dictResults.length){
    dictLabel.style.display='block';
    dictList.innerHTML = dictResults.map(dictCardHtml).join('');
  } else {
    dictLabel.style.display='none';
    dictList.innerHTML='';
  }
}

/* ============ ARTICLE DETAIL ============ */
function openArticle(id){
  const cur = activeViewName();
  navStack.push(cur==='article' ? {view:'article', articleId: currentArticleId} : {view: cur});
  showArticle(id);
}
function showArticle(id, skipHistory){
  currentArticleId = id;
  const a = ARTICLES.find(x=>x.id===id);
  if(!a) return;
  if(!skipHistory){
    state.history = [id, ...state.history.filter(h=>h!==id)].slice(0,20);
    saveState();
  }
  const t = a[state.lang];
  const r = regionById(a.region);
  document.getElementById('article-content').innerHTML = `
    <div><span class="detail-region">${r.flag} ${r[state.lang]}</span><span class="detail-cat">${catById(a.cat)[state.lang]}</span>${badgeHtml(a.badge)}</div>
    <div class="detail-title">${t.title}</div>
    <div class="detail-meta">${a.date} · ${L().byline}</div>
    <div class="detail-thumb">${a.emoji}</div>
    <div class="detail-body">${t.body.map(p=>`<p>${p}</p>`).join('')}</div>
    <div class="tag-row">${a.tags[state.lang].map(tg=>`<span class="tag-chip">#${tg}</span>`).join('')}</div>
  `;
  updateBookmarkBtn();
  const related = ARTICLES.filter(x=>(x.cat===a.cat || x.region===a.region) && x.id!==a.id).slice(0,3);
  document.getElementById('related-list').innerHTML = related.length ? related.map(artCardHtml).join('') : `<div class="empty-state">${L().emptyRelated}</div>`;
  showView('article');
  window.scrollTo(0,0);
}
function updateBookmarkBtn(){
  document.getElementById('bookmark-btn').classList.toggle('on', state.bookmarks.includes(currentArticleId));
}
function toggleBookmark(){
  if(currentArticleId==null) return;
  if(state.bookmarks.includes(currentArticleId)){
    state.bookmarks = state.bookmarks.filter(id=>id!==currentArticleId);
    toast(L().toastBmOff);
  } else {
    state.bookmarks.push(currentArticleId);
    toast(L().toastBmOn);
  }
  saveState();
  updateBookmarkBtn();
}

/* ============ DICTIONARY ============ */
let currentDictTag = 'all';
function selectDictTag(t){ currentDictTag = t; renderDictionary(); }
function dictCardHtml(d){
  const t = d[state.lang];
  const r = regionById(d.tag);
  const saved = state.savedTerms.includes(d.id);
  return `<div class="dict-card">
    <div onclick="toggleDictCard(this)">
      <div class="dict-term-row"><span class="dict-term">${d.term}</span><span class="dict-tag">${r.flag} ${r[state.lang]}</span></div>
      <div class="dict-meaning">${t.meaning}</div>
    </div>
    <div class="dict-detail">
      <div class="dict-detail-row"><span class="dict-detail-label">${L().originLabel}</span>${t.origin}</div>
      <div class="dict-detail-row"><span class="dict-detail-label">${L().exampleLabel}</span>${t.example}</div>
      <button class="dict-save-btn${saved?' on':''}" data-term-id="${d.id}" onclick="event.stopPropagation();toggleSaveTerm(${d.id})">${saved?L().savedTerm:L().saveTerm}</button>
    </div>
  </div>`;
}
function toggleDictCard(innerEl){
  const card = innerEl.closest('.dict-card');
  Array.from(card.parentElement.children).forEach(c=>{
    if(c!==card && c.classList.contains('dict-card')) c.classList.remove('open');
  });
  card.classList.toggle('open');
}
function toggleSaveTerm(id){
  const nowSaved = !state.savedTerms.includes(id);
  if(nowSaved){ state.savedTerms.push(id); toast(L().toastTermOn); }
  else { state.savedTerms = state.savedTerms.filter(t=>t!==id); toast(L().toastTermOff); }
  saveState();
  document.querySelectorAll(`.dict-save-btn[data-term-id="${id}"]`).forEach(b=>{
    b.classList.toggle('on', nowSaved);
    b.textContent = nowSaved ? L().savedTerm : L().saveTerm;
  });
  if(activeViewName()==='my') renderMy();
}
function renderDictionary(){
  const q = (document.getElementById('dict-search-inp').value||'').toLowerCase().trim();
  const tags = [...new Set(DICTIONARY.map(d=>d.tag))];
  document.getElementById('dict-cat-scroll').innerHTML =
    [`<button class="cat-chip${currentDictTag==='all'?' sel':''}" onclick="selectDictTag('all')">${L().allChip}</button>`]
    .concat(tags.map(t=>{const r=regionById(t);return `<button class="cat-chip${t===currentDictTag?' sel':''}" onclick="selectDictTag('${t}')">${r.flag} ${r[state.lang]}</button>`;})).join('');
  let list = currentDictTag==='all' ? DICTIONARY : DICTIONARY.filter(d=>d.tag===currentDictTag);
  if(q) list = list.filter(d=>d.term.toLowerCase().includes(q) || d[state.lang].meaning.toLowerCase().includes(q));
  document.getElementById('dict-list').innerHTML = list.length ? list.map(dictCardHtml).join('') : `<div class="empty-state">${L().emptyDict}</div>`;
}

/* ============ CALENDAR ============ */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function shiftMonth(delta){
  calMonth += delta;
  if(calMonth<0){ calMonth=11; calYear--; }
  if(calMonth>11){ calMonth=0; calYear++; }
  calSelDate = null;
  renderCalendar();
}
function renderCalendar(){
  document.getElementById('cal-month-label').textContent = L().monthLabel(calYear, calMonth);
  const grid = document.getElementById('cal-grid');
  let html = L().dow.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const startDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  const eventDates = new Set(CAL_EVENTS.map(e=>e.date));
  for(let i=0;i<startDay;i++) html += '<div class="cal-cell"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${calYear}-${pad(calMonth+1)}-${pad(d)}`;
    const isToday = dateStr===todayStr;
    const isSel = dateStr===calSelDate;
    const hasEvent = eventDates.has(dateStr);
    html += `<div class="cal-cell${hasEvent?' has-day':''}${isToday?' today':''}${isSel?' sel':''}" onclick="${hasEvent?`selectCalDate('${dateStr}')`:''}">${d}${hasEvent?'<span class=\"cal-dot\"></span>':''}</div>`;
  }
  grid.innerHTML = html;
  renderCalEvents();
}
function selectCalDate(dateStr){
  calSelDate = calSelDate===dateStr ? null : dateStr;
  renderCalendar();
}
function renderCalEvents(){
  const el = document.getElementById('cal-events');
  let events = CAL_EVENTS;
  if(calSelDate){
    events = events.filter(e=>e.date===calSelDate);
  } else {
    const monthPrefix = `${calYear}-${pad(calMonth+1)}`;
    events = events.filter(e=>e.date.startsWith(monthPrefix));
    if(!events.length){
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
      events = CAL_EVENTS.filter(e=>e.date>=todayStr).slice(0,5);
    }
  }
  events = [...events].sort((a,b)=>a.date.localeCompare(b.date));
  el.innerHTML = events.length ? events.map(e=>{
    const [y,m,d] = e.date.split('-');
    const t = e[state.lang];
    return `<div class="cal-event-card">
      <div class="cal-event-date"><div class="d">${parseInt(d)}</div><div class="m">${L().monthNames[parseInt(m)-1]}</div></div>
      <div class="cal-event-body"><div class="t">${t.title}</div><div class="desc">${t.desc}</div></div>
    </div>`;
  }).join('') : `<div class="empty-state">${L().emptyCalDay}</div>`;
}

/* ============ MY PAGE ============ */
let myTab = 'bookmarks';
function switchMyTab(tab){
  myTab = tab;
  document.querySelectorAll('.my-tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('my-bookmarks-list').style.display = tab==='bookmarks' ? 'flex' : 'none';
  document.getElementById('my-terms-list').style.display = tab==='terms' ? 'flex' : 'none';
  document.getElementById('my-history-list').style.display = tab==='history' ? 'flex' : 'none';
}
function renderMy(){
  document.getElementById('my-sub-stat').textContent = L().myStat(state.bookmarks.length, state.savedTerms.length, state.history.length);
  const bmList = ARTICLES.filter(a=>state.bookmarks.includes(a.id));
  document.getElementById('my-bookmarks-list').innerHTML = bmList.length ? bmList.map(artCardHtml).join('') : `<div class="empty-state">${L().emptyBm}</div>`;
  const termList = DICTIONARY.filter(d=>state.savedTerms.includes(d.id));
  document.getElementById('my-terms-list').innerHTML = termList.length ? termList.map(dictCardHtml).join('') : `<div class="empty-state">${L().emptyTerms}</div>`;
  const histList = state.history.map(id=>ARTICLES.find(a=>a.id===id)).filter(Boolean);
  document.getElementById('my-history-list').innerHTML = histList.length ? histList.map(artCardHtml).join('') : `<div class="empty-state">${L().emptyHist}</div>`;
  switchMyTab(myTab);
  const nlForm = document.getElementById('nl-form');
  const nlStatus = document.getElementById('nl-status');
  const nlUnsub = document.getElementById('nl-unsub');
  if(state.subscribed){
    nlForm.style.display='none';
    nlStatus.style.display='block';
    nlUnsub.style.display='inline-block';
    nlStatus.textContent = L().nlStatus(state.email);
  } else {
    nlForm.style.display='block';
    nlStatus.style.display='none';
    nlUnsub.style.display='none';
  }
}
function subscribeNewsletter(){
  const email = document.getElementById('nl-email').value.trim();
  const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!re.test(email)){ toast(L().toastEmail); return; }
  if(!document.getElementById('nl-consent-chk').checked){ toast(L().toastConsent); return; }
  state.subscribed = true;
  state.email = email;
  saveState();
  toast(L().toastSub);
  renderMy();
}
function unsubscribeNewsletter(){
  state.subscribed = false;
  state.email = '';
  saveState();
  toast(L().toastUnsub);
  renderMy();
}

/* ============ CONSENT BANNER ============ */
function acceptConsent(){
  state.consent = true;
  saveState();
  document.getElementById('consent-banner').classList.remove('show');
}

/* ============ INIT ============ */
applyLang();
renderHome();
if(!state.consent) document.getElementById('consent-banner').classList.add('show');
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
